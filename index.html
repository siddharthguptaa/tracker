<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Tracker App</title>
<style>
:root{
  --bg:#f5f6fa;--card:#ffffff;--ink:#14151f;--mute:#6b7085;--line:#e5e7ef;
  --accent:#4f46e5;--accent-ink:#ffffff;--accent-soft:#eceafd;
  --green:#16a34a;--green-soft:#e3f6ea;--amber:#d97706;--amber-soft:#fdf0dc;
  --red:#dc2626;--red-soft:#fde8e8;--teal:#0d9488;--grey-soft:#eceef4;--bar:#e6e8f0;--shadow:0 1px 2px rgba(20,21,31,.06),0 4px 14px rgba(20,21,31,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e0f16;--card:#171925;--ink:#eceefa;--mute:#9a9fb8;--line:#272a3b;
  --accent:#8b86ff;--accent-ink:#0e0f16;--accent-soft:#25244a;
  --green:#4ade80;--green-soft:#15301f;--amber:#fbbf24;--amber-soft:#3a2d12;
  --red:#f87171;--red-soft:#3b1717;--teal:#2dd4bf;--grey-soft:#242738;--bar:#2a2d41;--shadow:none;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0e0f16;--card:#171925;--ink:#eceefa;--mute:#9a9fb8;--line:#272a3b;
  --accent:#8b86ff;--accent-ink:#0e0f16;--accent-soft:#25244a;
  --green:#4ade80;--green-soft:#15301f;--amber:#fbbf24;--amber-soft:#3a2d12;
  --red:#f87171;--red-soft:#3b1717;--teal:#2dd4bf;--grey-soft:#242738;--bar:#2a2d41;--shadow:none;color-scheme:dark;}
:root[data-theme="light"]{color-scheme:light}
/* Eye comfort: warm paper, softened contrast, no pure white, less blue light */
:root[data-theme="comfort"]{--bg:#efe6d2;--card:#f6efdf;--ink:#3b3428;--mute:#7a6f5c;--line:#ddd0b5;
  --accent:#4a7c6f;--accent-ink:#f6efdf;--accent-soft:#dbe6d6;
  --green:#4d7c4a;--green-soft:#dfe8cf;--amber:#a8691c;--amber-soft:#f1e0bd;
  --red:#b25040;--red-soft:#f0d9cc;--teal:#3f7f76;--grey-soft:#e6dcc4;--bar:#ddd0b5;--shadow:0 1px 2px rgba(80,64,30,.08);color-scheme:light}
:root[data-theme="night"]{--bg:#1d1a15;--card:#26221b;--ink:#d9cfba;--mute:#a3977f;--line:#383228;
  --accent:#c9a45e;--accent-ink:#1d1a15;--accent-soft:#3a3120;
  --green:#9bb877;--green-soft:#2a3320;--amber:#d8a24a;--amber-soft:#3a2f18;
  --red:#d98b78;--red-soft:#3b261f;--teal:#7fb5a8;--grey-soft:#302b22;--bar:#3a3428;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{overflow-x:clip}
.grid>*,.vcard,.card,.panel{min-width:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);}
#app{position:relative;max-width:1180px;margin:0 auto;padding:16px 14px calc(88px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.3px;padding-right:104px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 4px 8px;font-weight:600}
h2.focus{color:var(--accent)}
h3{margin:0;font-size:16px;font-weight:650}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.stat{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-weight:700}
.stat span{font-size:11px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font-size:13.5px;font-weight:550;cursor:pointer;font-family:inherit}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start;margin-bottom:10px}
.grid .card,.grid .yrow{margin:0}
.narrow{max-width:640px}
@media (min-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#app{padding-left:22px;padding-right:22px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 10px;box-shadow:var(--shadow);cursor:pointer}
.card.fcard{border-left:4px solid var(--accent)}
.card:active{transform:scale(.99)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat{font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.cat .st{color:#f59e0b}
.pill{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st-notstarted{background:var(--grey-soft);color:var(--mute)}
.st-inprogress{background:var(--accent-soft);color:var(--accent)}
.st-completed{background:var(--green-soft);color:var(--green)}
.hstrip{display:flex;gap:3px;margin-top:10px;align-items:center}
.hstrip i{width:12px;height:12px;border-radius:3px;background:var(--bar)}
.hstrip i.h{background:var(--green)}.hstrip i.p{background:var(--amber)}
.hdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.hd{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.hd small{display:block;color:var(--mute);font-size:10.5px}
.hd.on{background:var(--green);border-color:var(--green);color:#fff}.hd.on small{color:#e6f6ec}
.hd:disabled{opacity:.35;cursor:default}
.themebtn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:var(--shadow);z-index:6}
.themebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sws{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--ink)}
.acc>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;padding:2px 0}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"▸";color:var(--mute);margin-left:4px;transition:transform .15s}
.acc[open]>summary::after{transform:rotate(90deg)}
.acc[open]>summary{margin-bottom:8px}
.accs{margin-left:auto;font-weight:500;color:var(--mute);font-size:12px}
.tagpill{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);margin:0 4px 2px 0}
.tagpick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.tagchk{display:inline-block;margin:0;font-size:inherit;cursor:pointer}
.tagchk input{display:none}
.tagchk span{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--tc);color:var(--tc);font-size:13px;font-weight:600}
.tagchk input:checked+span{background:var(--tc);color:#fff}
.tagrows{background:var(--card);border-radius:14px;padding:2px 14px;box-shadow:var(--shadow)}
.tgd{border-bottom:1px solid var(--line);padding:11px 0}
.tgd:last-child{border:0}
.tgd[open]>summary{margin-bottom:10px}
.sw.sm{width:28px;height:28px;border-width:2.5px}
.trw{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.trw:last-child{border:0}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttx{font-size:15px;font-weight:550;overflow-wrap:anywhere}
.tsub{font-size:12px;color:var(--mute);margin-top:2px}
.trw.dn .ttx{text-decoration:line-through;color:var(--mute)}
.grid .panel{margin:0}
.tadd{display:flex;gap:8px}
.tadd input{flex:1}
@media (max-width:420px){nav button{font-size:10.5px}}
nav .in{overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav button{flex:1 0 62px}
.pwbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;word-break:break-all}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border:0}
.vrow small{display:block;color:var(--mute);font-size:11.5px}
.vlock{max-width:420px;margin:24px auto 0}
.meter{height:6px;border-radius:99px;background:var(--bar);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:99px}
.gearbtn{right:58px}
.backbar{margin:0 0 4px}
.backbar button{background:none;border:0;color:var(--accent);font:inherit;font-weight:650;font-size:15px;padding:8px 0;cursor:pointer}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 10px;overflow-x:auto;scrollbar-width:none}.subtabs::-webkit-scrollbar{display:none}.subtabs button{white-space:nowrap;padding-left:8px!important;padding-right:8px!important;flex:1 0 auto!important}
.subtabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;font:inherit;font-size:13.5px;color:var(--mute);font-weight:600;cursor:pointer;margin-bottom:-1px}
.subtabs.six button{font-size:11.5px;letter-spacing:-.02em;padding:10px 0}
.subtabs.five button{font-size:12.5px;letter-spacing:-.01em;padding:10px 0}
.subtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#moneyhost{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg)}
#moneyhost[hidden]{display:none}
#moneyhost iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
nav::after{content:"";position:absolute;inset:0;background:rgba(10,16,22,.52);opacity:0;pointer-events:none;transition:opacity .18s}
body.tlayer nav::after{opacity:1}
.utoast{pointer-events:auto;display:flex;gap:16px;align-items:center;bottom:calc(138px + env(safe-area-inset-bottom,0px))}
.utoast button{background:none;border:0;color:var(--accent-ink);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.card.arch{opacity:.6}
.next.bad{color:var(--amber);font-weight:600}
.chkrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);font-weight:500;margin:0;padding:7px 0}
.chkrow input{width:auto;flex:none}
.deplist{max-height:170px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px 12px}
.trow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent}
.trow.on{border-color:var(--accent)}
.trow .tn{flex:1;min-width:0;font-weight:650;font-size:14px}
.trow .tn small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 2px}
.legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.e{border-top:2px dotted var(--mute)}.legend i.t{border-top:2px dashed var(--green)}
.searchrow{display:flex;gap:8px;margin:12px 0 2px}
.searchrow select{width:auto;max-width:46%}
.next{margin-top:9px;font-size:12.5px;color:var(--mute)}
.next.red{color:var(--red);font-weight:600}.next.ok{color:var(--green);font-weight:600}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:none;color:transparent;font-size:15px;line-height:1;cursor:pointer;padding:0}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.mk{position:absolute;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);background:var(--card);border:1.5px solid var(--accent);z-index:3}
.mk.done{background:var(--green);border-color:var(--green)}
.st-draft{background:var(--surface-1);color:var(--text-secondary);border:0.5px dashed var(--border-strong)}
.card.dcard{border:1px dashed var(--border-strong);box-shadow:none}
.tbar.draft{border-style:dashed}
.dch{display:flex;gap:6px;margin-top:8px}
.dch button{flex:1;border:0.5px solid var(--border-strong);background:var(--card);color:var(--text-secondary);border-radius:9px;padding:7px 2px;font:inherit;font-size:12px;cursor:pointer}
.dch button.fin{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:650}
.dch button.car{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.dch button.drp{background:var(--grey-soft);color:var(--ink);font-weight:650}
.banner.bridge{background:var(--amber-soft);border-color:var(--amber)}
.st-onhold{background:var(--amber-soft);color:var(--amber)}
.nums{display:flex;align-items:baseline;gap:6px;margin:8px 0 8px;flex-wrap:wrap}
.nums b{font-size:20px;font-weight:700;letter-spacing:-.3px}
.nums span{color:var(--mute);font-size:13px}
.nums .pct{margin-left:auto;font-weight:700;color:var(--ink);font-size:14px}
.bar{position:relative;height:9px;border-radius:99px;background:var(--bar);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);min-width:0}
.bar.done i{background:var(--green)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.bar.thin{height:5px}
.bar.thin i{background:var(--teal)}
.bar.thin.done i{background:var(--green)}
.ylabel{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:10px 0 4px}
.ylabel b{color:var(--ink)}
.dates{margin-top:10px;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dates b{color:var(--ink);font-weight:600}
.meta{display:flex;justify-content:space-between;margin-top:5px;font-size:12.5px;color:var(--mute)}
.ok{color:var(--green);font-weight:600}.bad{color:var(--amber);font-weight:600}.red{color:var(--red);font-weight:600}
.seg{display:flex;background:var(--grey-soft);border-radius:13px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font:inherit;font-weight:650;color:var(--mute);cursor:pointer}
.seg small{display:block;font-weight:500;font-size:10.5px;opacity:.8}
.seg.wrap{flex-wrap:wrap;gap:2px}.seg.wrap button{flex:1 1 30%}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:11px 13px;margin:10px 0;cursor:pointer;font-size:13.5px}
.banner .bn{color:var(--mute);margin-top:3px;font-size:12.5px}
.banner .bs{margin-top:5px;font-size:12px;color:var(--mute)}
.banner.late{background:var(--red-soft);border-color:var(--red)}
.banner.late .bs{color:var(--red);font-weight:600}
.alert{background:var(--red-soft);border:1px solid var(--red);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px;cursor:pointer}
.alert b{color:var(--red)}
.money-mini{background:var(--card);border-radius:14px;padding:11px 13px;margin:10px 0;box-shadow:var(--shadow);cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.money-mini small{color:var(--mute);display:block;font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{display:flex;width:100%;max-width:760px}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0 8px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(50% - 568px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(79,70,229,.4);cursor:pointer;z-index:19}
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.panel{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.kv div{background:var(--card);border-radius:12px;padding:9px 10px}
.kv small{display:block;color:var(--mute);font-size:11px}
.kv b{font-size:13.5px}
label{display:block;font-size:12px;color:var(--mute);font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--accent);min-height:16px;margin-top:3px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%;margin-top:12px}
.btn.alt{background:var(--grey-soft);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.small{padding:7px 12px;font-size:13px;width:auto;margin:0}
.btns{display:flex;gap:10px}
.log{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px}
.log:last-child{border:0}
.log small{color:var(--mute)}
.x{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.yrow{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.yrow.yfocus{border-left:4px solid var(--accent)}
.yrow .row input{width:130px;text-align:right;padding:7px 10px}
.ytitle{display:flex;align-items:center;gap:4px;min-width:0}
.star{background:none;border:0;font-size:24px;line-height:1;color:var(--mute);padding:2px 8px 2px 0;cursor:pointer}
.star.on{color:#f59e0b}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mrow:last-of-type{border:0}
.mrow input{width:120px;text-align:right;padding:6px 9px}
.mtot{display:flex;justify-content:space-between;font-weight:700;margin-top:6px}
.gap-ok{color:var(--green)}.gap-bad{color:var(--red)}
.tl{background:var(--card);border-radius:16px;padding:0 14px 10px;box-shadow:var(--shadow)}
.tl-row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:7px 10px;align-items:center}
.tl-row.head{position:sticky;top:0;z-index:5;background:var(--card);padding:12px 0 6px;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.tl-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.tl-head{display:flex}
.tl-head span b{font-weight:inherit}
.tl-head .yf{display:none}
.tl-head span{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:4px;font-size:11px;color:var(--mute);font-weight:600}
.tl-sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--mute);margin:18px 0 2px}
.tl-sec.f{color:var(--accent)}
.tl-item{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tl-name .dt{display:none}
.tl-name .nm{font-size:12.5px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.tl-name .st{color:#f59e0b}
.tl-name small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.track{position:relative;height:18px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--yw))}
.tbar{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--accent-soft);overflow:hidden;border:1px solid var(--accent)}
.tbar i{display:block;height:100%;background:var(--accent)}
.tbar.done{border-color:var(--green);background:var(--green-soft)}.tbar.done i{background:var(--green)}
.tbar.dim{opacity:.55}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);z-index:2;pointer-events:none}
@media (min-width:760px){.tl-row{grid-template-columns:230px minmax(0,1fr);gap:7px 16px}.tl-name .dt{display:inline}.tl-name .nm{font-size:13.5px}.tl-head .yf{display:inline}.tl-head .ys{display:none}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.note{font-size:12.5px;color:var(--mute);margin:6px 2px}
.list-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;padding:14px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.list-btn small{color:var(--mute);display:block;font-size:12px}
.rv{padding:11px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border:0}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.hit{background:var(--green-soft);color:var(--green)}
.tag.part{background:var(--amber-soft);color:var(--amber)}
.tag.miss{background:var(--red-soft);color:var(--red)}
.tag.prog{background:var(--accent-soft);color:var(--accent)}
.tag.none{background:var(--grey-soft);color:var(--mute)}
.vcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.vic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px;flex:none}
.vmain{min-width:0;flex:1}.vt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vbadges{display:flex;gap:4px;flex:none}
.vtools{display:flex;gap:8px;margin:6px 0}.vtools .chip{flex:1;text-align:center}
.vgenrow{display:flex;gap:8px;margin-top:8px}.vgenrow select{flex:1}
.vfrow{display:flex;gap:6px;margin-top:6px;align-items:center}.vfrow input{flex:1;min-width:0}.vfrow select{width:92px;flex:none}
.vnewgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.vnew{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-align:left;font:inherit;cursor:pointer;min-height:110px}
.vnew span{font-size:28px}.vnew small{color:var(--mute);font-size:12px}
.totpcode{font:700 28px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--accent);display:block}
.totpbar{height:4px;background:var(--bar);border-radius:3px;margin-top:6px;overflow:hidden}.totpbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width 1s linear}
.totpleft{color:var(--mute);font-weight:600;margin-left:6px}
.vgout{font:600 18px ui-monospace,Menlo,monospace;overflow-wrap:anywhere;padding:6px 2px 8px;user-select:all}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}.stepper button:disabled{opacity:.35}.stepper b{min-width:26px;text-align:center;font-size:17px}
.dgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}@media(min-width:700px){.dgrid{grid-template-columns:1fr 1fr}}
.dcard{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);cursor:pointer}
.dcard h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:15px}
.dcard .dm{color:var(--mute);font-size:12px;font-weight:500}
.dk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.dk div{background:var(--grey-soft);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}.dk b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dk small{color:var(--mute);font-size:11.5px}
.wbars{display:flex;align-items:flex-end;gap:6px;height:76px}.wbars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.wbars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}.wbars small{font-size:10.5px;color:var(--mute);margin-top:3px}
.dbar{height:7px;background:var(--bar);border-radius:4px;overflow:hidden;margin-top:3px}.dbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.stat[data-act]{cursor:pointer}

/* ---- to-do v2 ---- */
.tdbar{display:flex;gap:8px;align-items:center;margin:12px 0 2px}
.ib{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--grey-soft);font-size:18px;cursor:pointer;color:var(--ink)}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.chk.sq{border-radius:7px}
.dh{flex:none;align-self:center;padding:6px 4px 6px 10px;color:var(--mute);font-size:20px;line-height:1;touch-action:none;cursor:grab;user-select:none}
.trw.dragging{background:var(--accent-soft);border-radius:10px;box-shadow:var(--shadow);position:relative;z-index:2}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:min(96vw,720px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow)}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding:2px 0}
.cd{aspect-ratio:1/1.05;border:0;border-radius:10px;background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;cursor:pointer}
.cd.e{background:none;cursor:default}
.cd b{font-size:14px;font-weight:650}
.cd i{font-style:normal;font-size:9px;line-height:1;height:10px;color:var(--accent)}
.cd i u{text-decoration:none}.cd i u.late{color:var(--red)}.cd i u.ok{color:var(--green)}
.cd.td b{color:var(--accent)}
.cd.sel{outline:2px solid var(--accent);background:var(--accent-soft)}
.tsrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.tsrow input[type=text]{flex:1;min-width:0}
.tsrow input[type=checkbox]{width:22px;height:22px;flex:none}
.pvrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0;min-height:0}
.pv{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
/* ---- vault v2 ---- */
.vtools{display:flex;gap:8px;margin:8px 0 2px;flex-wrap:wrap}.vtools .chip{white-space:normal;flex:1 1 auto;text-align:center;padding-left:10px;padding-right:10px}
.vq{display:flex;gap:6px;flex:none}
.qc{width:38px;height:38px;border-radius:11px;border:0;background:var(--accent-soft);font-size:17px;cursor:pointer;line-height:1}
.vnewgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.vnew{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:var(--ink);cursor:pointer}
.vnew span{font-size:22px}.vnew small{color:var(--mute);font-size:12px}
.vfiles{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.vfile{width:92px;border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.vfile img,.vfile .pdf{display:flex;align-items:center;justify-content:center;width:92px;height:92px;object-fit:cover;border-radius:12px;background:var(--grey-soft);font-size:34px}
.vfile small{display:block;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.vview{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 10px 10px}
.vview img{max-width:100%;max-height:100%;object-fit:contain}
.vvbar{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;color:#fff}
.vvbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vvpdf{color:#fff;text-align:center;font-size:56px}.vvpdf p{font-size:15px}
.totpbox{align-items:flex-start}
#printarea{display:none}
@media print{
  body.printing>*:not(#printarea){display:none!important}
  #printarea{display:block!important;color:#000;background:#fff;padding:12mm;font-family:system-ui,sans-serif}
  #printarea td{border-bottom:1px solid #ccc;padding:3px 6px;vertical-align:top}#printarea td:first-child{width:34%;color:#555}
}

/* ---- layout safety: any length of text must wrap, never widen the page ---- */
body{overflow-wrap:anywhere}
#app *,.sheet *,.overlay *{min-width:0}
.sheet{overflow-x:hidden}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
input,select,textarea{max-width:100%}
input[type=date],input[type=time]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
.tagpill,.pill,.cat,.accs{max-width:100%}
.tagchk{max-width:100%}
.tagpick{flex-wrap:wrap}
.vt,.vcard .note{max-width:100%}
.vrow>div,.vrow small,.vrow span{overflow-wrap:anywhere;word-break:break-word}
.x{flex:none;min-width:30px}
button,.btn,.chip{overflow-wrap:anywhere}
.chip{white-space:nowrap}
.seg button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px;padding-right:6px}
.tdbar{flex-wrap:wrap}.tdbar .seg{flex:1 1 170px}.seg button{text-overflow:clip}
.ib{flex:none}

/* ===== laptop / desktop: side navigation rail, roomier content ===== */
@media (min-width:1024px){
  nav{left:0;right:auto;top:0;bottom:0;width:216px;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:18px 12px;flex-direction:column;overflow-y:auto}
  nav::before{content:"Tracker";display:block;font-size:20px;font-weight:800;letter-spacing:-.3px;padding:2px 14px 16px;color:var(--ink)}
  nav .in{flex-direction:column;max-width:none;width:100%;gap:4px;overflow:visible}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 14px;border-radius:12px;font-size:15px;min-height:46px}
  nav button:hover{background:var(--grey-soft,rgba(120,120,140,.12));color:var(--ink)}
  nav button.on{background:var(--accent-soft);color:var(--accent)}
  nav button svg{width:22px;height:22px;flex:none}
  body{padding-left:216px}
  #app{max-width:1240px;padding:26px 36px 60px}
  #moneyhost{left:216px;bottom:0!important}
  .fab{right:max(28px,calc((100vw - 216px - 1240px)/2 + 40px));bottom:32px}
  .toast{left:calc(50% + 108px);bottom:28px}
  .selbar{left:calc(50% + 108px);bottom:28px}
  .overlay{align-items:center}
  .sheet{border-radius:22px;max-height:88vh;max-width:640px}
  .dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .vlock{margin-top:60px}
}
@media (min-width:1500px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1024px) and (hover:hover){.trw:hover,.list-btn:hover{background:rgba(120,120,140,.07)}button,[data-act]{cursor:pointer}}
</style>
</head>

async function vExport(kind) {

  const name = "vault-" + todayStr();

      ws["!cols"] = V_COLS.map((c, n) => ({wch:n === 3 ? 28 : n === 4 || n === 7 ? 34 : 18})); XLSX.utils.book_append_sheet(wb, ws, "Vault");
      download(name + ".xlsx", XLSX.write(wb, {bookType:"xlsx", type:"array"}), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); toast(rows.length + " items exported — delete the file when you're done"); return;
    } catch (e) { toast("Couldn't load the Excel writer, so I saved a CSV instead"); }

      if (rest.length) body += `<h2>Other goals</h2>` + group(rest);
      if (dr.length) body += `<h2>Drafts (${dr.length})</h2>${cards(dr)}`;
    } else if (rest.length || dr.length) {
      body += `<p class="note">${rest.length} other goal${rest.length===1?"":"s"} parked this year${dr.length?` · ${dr.length} draft${dr.length>1?"s":""}`:""} — switch to “All goals” to see ${rest.length+dr.length>1?"them":"it"}.</p>`;
    }
    toggle = `<div class="seg"><button class="${scope==="focus"?"on":""}" data-act="scope" data-v="focus">This year (${y})</button><button class="${scope==="all"?"on":""}" data-act="scope" data-v="all">All goals</button></div>`;
    stats = `<div class="stat"><b>${act.length}</b><span>Goals</span></div><div class="stat"><b>${fg.length}</b><span>In focus</span></div><div class="stat"><b>${runningNow(y).length}</b><span>Focus running now</span></div><div class="stat"><b>${avg.toFixed(1)}%</b><span>Overall progress</span></div>`;
    money = moneyMini();
  } else {
    const list = gs.filter(inCat);
    body = list.length ? group(list) : `<div class="empty">${searching ? "No goals match your search." : `Nothing planned for ${planLabel(P)} yet.<br>Open a goal and tap “Create next-plan goal”, or use the handover review below.`}</div>`;
    toggle = `<p class="note">Planning ahead for ${planLabel(P).toLowerCase()}. Draft goals don't count toward focus, progress or money checks until you promote them.</p>`;

  }

  const archSec = state.goals.some(g => g.plan === P.id && g.archived) ? `<button class="list-btn" data-act="togglearch" style="margin-top:${done.length?0:14}px"><span>${ui.showArch ? "Hide" : "Show"} archived (${state.goals.filter(g => g.plan === P.id && g.archived).length})<small>Goals you've put away</small></span>›</button>` + (ui.showArch ? (arch.length ? cards(arch) : `<p class="note">No archived goals match.</p>`) : "") : "";
  const prev = state.plans[state.plans.findIndex(p => p.id === P.id) - 1];
  const handoverBtn = nxt ? `<button class="list-btn" data-act="handover" data-v="${P.id}" style="margin-top:14px"><span>🧭 Handover review · ${planLabel(P)} → ${planLabel(nxt)}<small>Decide what finishes, carries over, or gets dropped</small></span>›</button>`
    : prev ? `<button class="list-btn" data-act="handover" data-v="${prev.id}" style="margin-top:14px"><span>🧭 Handover review · ${planLabel(prev)} → ${planLabel(P)}<small>See what is carrying into this plan</small></span>›</button>` : "";
  const sortOpts = [["default","Order added"],["deadline","Deadline"],["progress","Progress (lowest first)"],["name","Name A–Z"]];
  return `<h1>My Goals</h1><p class="sub">Plan ${planLabel(P).toLowerCase()} · ${year(P.start)} – ${year(P.end)}</p>
  ${bannersHtml()}
  ${planSeg()}
  ${toggle}
  <div class="stats">${stats}</div>
  ${money}
  <div class="searchrow"><input id="q" type="search" placeholder="Search goals" value="${esc(ui.q || "")}" aria-label="Search goals"><select data-act="set-sort" aria-label="Sort goals">${sortOpts.map(([v,l]) => `<option value="${v}" ${state.settings.sort===v?"selected":""}>${l}</option>`).join("")}</select></div>

  <p class="note">Thick bar = overall goal (line = where you should be today). Thin teal bar = this year's target.</p>
  ${body}
  ${archBtn}${archSec}
  ${handoverBtn}`;
}

function yearRange() {
  let lo = 2026, hi = 2032;
  state.plans.forEach(p => { lo = Math.min(lo, year(p.start)); hi = Math.max(hi, year(p.end)); });
  state.goals.forEach(g => { if (g.start) lo = Math.min(lo, year(g.start)); if (g.end) hi = Math.max(hi, year(g.end)); });
  const out = []; for (let y = lo; y <= hi; y++) out.push(y); return out;
}

function moneyPanel(y) {
  const rows = moneyRows(y), cap = state.capacity[y];
  const head = `<b>💰 Money check · ${y}</b>`;
  let body = "";
  if (!rows.length) {
    body = `<p class="note">None of your ${y} focus goals use money. Set “Counts toward money check” to Yes in a goal's edit form.</p>`;
  } else {
    body = rows.map(r => `<div class="mrow"><span>${esc(r.g.name)}${r.auto?"":`<br><small style="color:var(--mute)">${esc(r.g.unit?r.g.unit+" goal":"count goal")} – enter ₹ to set aside</small>`}</span>
      ${r.auto ? `<b>${fmt(r.amt,"₹")}</b>` : `<input type="number" inputmode="decimal" step="any" placeholder="₹ amount" value="${r.amt||""}" data-act="budget" data-id="${r.g.id}" aria-label="Money for ${esc(r.g.name)}">`}</div>`).join("");
    const planned = moneyPlanned(y), hasCap = cap != null && cap !== "", gap = (hasCap ? cap : 0) - planned;
    body += `<div class="mtot"><span>Planned for ${y}</span><span>${fmt(planned,"₹")}</span></div>
      <label>How much can you realistically save in ${y}? (₹)</label>

      ${hasCap ? `<div class="mtot" style="margin-top:10px"><span>${gap>=0?"Surplus":"Shortfall"}</span><span class="${gap>=0?"gap-ok":"gap-bad"}">${fmt(Math.abs(gap),"₹")}</span></div>
        <p class="note">${gap>=0?"Your focus goals fit inside your savings.":"Your focus goals ask for more money than you can save. Park a goal or lower a target."}</p>` : ""}`;
  }
  return `<div class="panel">${head}${body}</div>`;
}

function yearRow(g, y) {
  const t = yearTarget(g, y), a = yearAchieved(g, y), f = isFocus(g, y);
  const ratio = t > 0 && a != null ? clamp(a/t) : 0, lvl = g.type === "level";
  return `<div class="yrow ${f?"yfocus":""}">
    <div class="row"><div class="ytitle"><button class="star ${f?"on":""}" data-act="togglefocus" data-id="${g.id}" data-y="${y}" aria-label="Toggle focus">${f?"★":"☆"}</button>

      <input type="number" inputmode="decimal" step="any" placeholder="Set target" value="${t ?? ""}" ${g.type==="milestones"||g.type==="habit"?'disabled title="Set automatically"':""} data-act="target" data-id="${g.id}" aria-label="${y} target for ${esc(g.name)}"></div>

}

function tlItem(g, ys, lo, span, focus, nowLeft) {
  const pos = t => clamp((t-lo)/span)*100;
  const l = pos(ts(g.start)), w = Math.max(1.5, pos(ts(g.end)) - l), dr = g.status === "Draft";
  return `<div class="tl-row tl-item" data-act="open" data-id="${g.id}">
    <div class="tl-name"><div class="nm">${focus?'<span class="st">★</span> ':""}${esc(g.name)}${dr?' <small style="display:inline">· draft</small>':""}</div><small><span class="dt">${fmtDate(g.start)} → ${fmtDate(g.end)} · </span>${pctText(g)}</small></div>
    <div class="track" style="--yw:${100/ys.length}%">${nowLeft===null?"":`<div class="today" style="left:${nowLeft}%"></div>`}
      <div class="tbar ${g.status==="Completed"?"done":""} ${focus?"":"dim"} ${dr?"draft":""}" style="left:${l}%;width:${w}%"><i style="width:${(pct(g)*100).toFixed(1)}%"></i></div>${g.type==="milestones"?(g.milestones||[]).map(m=>`<span class="mk ${m.done?"done":""}" style="left:${pos(ts(m.date))}%" title="${esc(m.title)}"></span>`).join(""):""}</div>
  </div>`;
}
function viewTimeline() {
  const P = curPlan(), y = fy(), isCur = P.id === planOfYear(y).id;
  const all = state.goals.filter(g => !g.archived && g.start && g.end && g.plan === P.id);
  const ys = []; for (let v = year(P.start); v <= year(P.end); v++) ys.push(v);
  const cats = ["All", ...allCats().filter(c => all.some(g => g.category === c))];
  if (!cats.includes(ui.cat)) ui.cat = "All";
  const gs = all.filter(g => ui.cat === "All" || g.category === ui.cat);
  const chips = `<div class="chips">${cats.map(c=>`<button class="chip ${ui.cat===c?"on":""}" data-act="cat" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  const head0 = `<h1>Timeline</h1><p class="sub">${planLabel(P)} · ${year(P.start)}–${year(P.end)}. The red line is today.</p>${bannersHtml()}${planSeg()}`;
  if (!all.length) return head0 + `<div class="empty">Nothing planned for ${planLabel(P)} yet.</div>`;
  const lo = ts(ys[0]+"-01-01"), hi = ts((ys[ys.length-1]+1)+"-01-01"), span = hi - lo;
  const nowLeft = Date.now() >= lo && Date.now() < hi ? (clamp((Date.now()-lo)/span)*100).toFixed(2) : null;
  const head = ys.map(yy=>`<span><b class="yf">${yy}</b><b class="ys">’${String(yy).slice(2)}</b></span>`).join("");
  const foc = isCur ? gs.filter(g => isFocus(g,y)) : [], rest = gs.filter(g => !foc.includes(g));
  return `${head0}${chips}
  <div class="tl">
    <div class="tl-row head"><div class="tl-lbl">Goal</div><div class="tl-head">${head}</div></div>
    ${isCur ? `<div class="tl-sec f">🎯 Focus ${y} · ${runningNow(y).length} of ${foc.length} running now</div>${foc.length ? foc.map(g=>tlItem(g,ys,lo,span,true,nowLeft)).join("") : `<p class="note">No focus goals chosen.</p>`}` : ""}
    ${rest.length ? `<div class="tl-sec">${isCur?"Other goals":"All goals"}</div>` + rest.map(g=>tlItem(g,ys,lo,span,false,nowLeft)).join("") : ""}
  </div>`;
}

/* ============ Sheets ============ */
function openSheet(kind, id) {
  if (kind === "detail") {
    const o = $("#ov"); if (o) o.remove(); document.body.style.overflow = "";
    ui.sheet = null; ui.page = {kind:"detail", id}; ui.editLog = null; ui.editMs = null; ui.hw = 0; ui.prefill = null; render(); window.scrollTo(0, 0); return;
  }
  ui.sheet = {kind, id}; ui.editLog = null; ui.editMs = null; ui.hw = 0; renderSheet(); }
function closeSheet() { ui.sheet = null; ui.editLog = null; ui.editMs = null; ui.prefill = null; const o = $("#ov"); if (o) o.remove(); document.body.style.overflow = ""; }
function renderSheet() {
  const s = ui.sheet; if (!s) return;
  let html = s.kind === "detail" ? sheetDetail(goalById(s.id)) : s.kind === "review" ? sheetReview(+s.id) : s.kind === "handover" ? sheetHandover(s.id) : s.kind === "import" ? sheetImport() : s.kind === "tags" ? sheetTags() : s.kind === "todoimport" ? sheetTodoImport() : s.kind === "vdetail" ? sheetVDetail(vById(s.id)) : s.kind === "vedit" ? sheetVEdit(s.id ? vById(s.id) : null) : s.kind === "vgen" ? sheetVGen() : s.kind === "vhealth" ? sheetVHealth() : s.kind === "vnew" ? sheetVNew() : s.kind === "todonew" ? sheetTodoNew() : s.kind === "todo" ? sheetTodo(state.todos.find(t => t.id === s.id)) : s.kind === "tmove" ? sheetTMove() : s.kind === "tstats" ? sheetTStats() : s.kind === "tpl" ? sheetTpl() : s.kind === "tpledit" ? sheetTplEdit() : s.kind === "vemerg" ? sheetVEmerg() : s.kind === "quick" ? sheetQuick() : sheetEdit(s.id ? goalById(s.id) : null);
  if (!html) { closeSheet(); return; }
  let o = $("#ov"), keep = 0;
  if (o) keep = o.firstElementChild.scrollTop; else { o = document.createElement("div"); o.id = "ov"; o.className = "overlay"; document.body.appendChild(o); }
  o.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  o.firstElementChild.scrollTop = keep; document.body.style.overflow = "hidden";
  if (s.kind === "vdetail") vHydrate();
  if (s.kind === "todonew" && !s.focused) { s.focused = 1; const i = $("#tn_text"); if (i) setTimeout(() => { try { i.focus(); } catch (e) {} }, 60); }
}
function refresh() { render(); renderSheet(); }

function habitPanel(g) {

      <div style="min-width:0"><b style="${m.done?"text-decoration:line-through;color:var(--mute)":""}">${esc(m.title)}</b><br><small>${m.done ? "Done " + fmtDate(m.doneDate || m.date) : (m.date < t ? `<span class="red">Overdue</span> · was due ` : "Due by ") + fmtDate(m.date)}</small></div></div>
      <span style="white-space:nowrap"><button class="x" data-act="msedit" data-mid="${m.id}" aria-label="Edit milestone">✎</button><button class="x" data-act="msdel" data-id="${g.id}" data-mid="${m.id}" aria-label="Delete milestone">✕</button></span></div>`).join("");

    <button class="btn" data-act="msadd" data-id="${g.id}">Add milestone</button>

  </details>`;
}

function sheetDetail(g) {

  ${ms ? msPanel(g) : hab ? habitPanel(g) : `<details class="panel acc" data-acc="log" ${accOpen("log")}><summary>${lvl?"Update current value":"Log progress"}</summary>

      <div><label>Date</label><input id="ld" type="date" value="${todayStr()}"></div>
    </div>
    <label>Note (optional)</label><input id="ln" type="text" placeholder="e.g. Salary SIP">

        <div class="g2"><div><label>${lvl?"Value":"Amount"}</label><input id="ea" type="number" inputmode="decimal" step="any" value="${l.amount}" data-unit="${esc(g.unit)}" data-hint="eah"><div class="hint" id="eah"></div></div>
        <div><label>Date</label><input id="ed" type="date" value="${l.date}"></div></div>
        <label>Note</label><input id="en" type="text" value="${esc(l.note||"")}">
        <div class="btns"><button class="btn alt" data-act="cancellog">Cancel</button><button class="btn" data-act="savelog" data-id="${g.id}" data-lid="${l.id}">Save changes</button></div></div>`
      : `<div class="log"><div><b>${lvl?"":(l.amount>0?"+":"")}${fmt(l.amount,g.unit)}</b><br><small>${fmtDate(l.date)}${l.note?" · "+esc(l.note):""}</small></div><span><button class="x" data-act="editlog" data-lid="${l.id}" aria-label="Edit entry">✎</button><button class="x" data-act="dellog" data-id="${g.id}" data-lid="${l.id}" aria-label="Delete entry">✕</button></span></div>`).join("")

function sheetHandover(pid) {
  const P = planById(pid), N = nextPlan(pid); if (!P || !N) return "";
  const gs = state.goals.filter(g => !g.archived && g.plan === pid && g.status !== "Draft");
  const dec = g => g.status === "Completed" ? "finish" : (g.handover || null);
  const cnt = k => gs.filter(g => dec(g) === k).length, und = gs.filter(g => !dec(g)).length;
  const toMake = gs.filter(g => dec(g) === "carry" && !successorOf(g)).length;
  const toDrop = gs.filter(g => dec(g) === "drop" && g.status !== "On Hold").length;
  const rows = gs.map(g => {
    const d = dec(g), pr = projectAt(g, g.end), sg = suggest(g), succ = successorOf(g);
    const line = g.status === "Completed" ? "Completed" : g.type === "habit" ? `${Math.round(habitStats(g).consistency*100)}% consistency · ${habitStats(g).streak}-week streak` : g.type === "milestones" ? `${current(g)} of ${(g.milestones||[]).length} milestones done` : (pr >= g.total ? `On pace to reach ${fmt(g.total,g.unit)} by ${fmtDate(g.end)}` : `At current pace: ${fmt(pr,g.unit)} by ${fmtDate(g.end)} (target ${fmt(g.total,g.unit)})`);
    const chips = g.status === "Completed" ? "" : `<div class="dch">
      <button class="${d==="finish"?"fin":""}" data-act="decide" data-id="${g.id}" data-v="finish">Finish</button>
      <button class="${d==="carry"?"car":""}" data-act="decide" data-id="${g.id}" data-v="carry">Carry to ${planLabel(N)}</button>
      <button class="${d==="drop"?"drp":""}" data-act="decide" data-id="${g.id}" data-v="drop">Drop</button></div>`;
    return `<div class="rv"><div class="row"><b>${esc(g.name)}</b><span class="note" style="margin:0">${esc(g.category)}</span></div>
      <div class="note" style="margin:3px 0 0">${esc(line)}</div>
      ${chips}
      <div class="note" style="margin:6px 0 0">${succ ? `✓ Draft created in ${planLabel(N)}` : (!d ? `Suggested: ${sg === "finish" ? "Finish" : "Carry over"}` : "")}</div></div>`;
  }).join("");
  return `<h1>🧭 ${planLabel(P)} → ${planLabel(N)}</h1>
  <p class="sub">Handover review · decide what happens to each goal as ${planLabel(P).toLowerCase()} ends.</p>
  <div class="stats" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><b>${cnt("finish")}</b><span>Finish</span></div><div class="stat"><b>${cnt("carry")}</b><span>Carry over</span></div>
    <div class="stat"><b>${cnt("drop")}</b><span>Drop</span></div><div class="stat"><b>${und}</b><span>Undecided</span></div></div>
  <div class="panel">${rows || `<p class="note">No active goals in ${planLabel(P)}.</p>`}</div>
  ${und ? `<button class="btn alt" data-act="usesuggest" data-v="${pid}">Use suggestions for the ${und} undecided</button>` : ""}
  ${toMake || toDrop ? `<button class="btn" data-act="applyhandover" data-v="${pid}">Apply: ${toMake ? `create ${toMake} draft${toMake>1?"s":""} in ${planLabel(N)}` : ""}${toMake && toDrop ? " · " : ""}${toDrop ? `put ${toDrop} on hold` : ""}</button>` : ""}
  <button class="btn alt" data-act="close">Close</button>`;
}

function sheetReview(y) {
  const fg = focusGoals(y), ny = y + 1, over = y < curYear();
  const rows = fg.map(g => {
    const t = yearTarget(g,y), a = yearAchieved(g,y) || 0, has = t > 0, r = has ? a/t : 0;
    let tag;
    if (!has) tag = `<span class="tag none">No target</span>`;
    else if (r >= 1) tag = `<span class="tag hit">✓ Hit</span>`;
    else if (!over) tag = `<span class="tag prog">In progress</span>`;
    else tag = r >= .5 ? `<span class="tag part">Partly</span>` : `<span class="tag miss">Missed</span>`;
    const unfinished = !has || r < 1;
    const carried = isFocus(g, ny);
    let btn = "";
    if (unfinished || over) {
      if (carried) btn = `<span class="note">In ${ny} focus ✓</span>`;
      else if (year(g.end) < ny) btn = `<span class="note">Deadline passed</span>`;
      else btn = `<button class="btn small alt" data-act="carry" data-id="${g.id}" data-y="${y}">Carry to ${ny}</button>`;
    }
    return `<div class="rv"><div class="row"><b>${esc(g.name)}</b>${tag}</div>
      <div class="bar thin ${r>=1?"done":""}" style="margin:9px 0 6px"><i style="width:${(clamp(r)*100).toFixed(1)}%"></i></div>
      <div class="row"><span class="note" style="margin:0">${fmt(a,g.unit)} of ${has?fmt(t,g.unit):"—"}${has?" · "+Math.round(r*100)+"%":""}</span>${btn}</div></div>`;
  }).join("");
  const withT = fg.filter(g => yearTarget(g,y) > 0), hit = withT.filter(g => (yearAchieved(g,y)||0) >= yearTarget(g,y)).length;
  const carryable = fg.filter(g => { const t = yearTarget(g,y); return (!(t>0) || (yearAchieved(g,y)||0) < t) && !isFocus(g,ny) && year(g.end) >= ny; });
  return `<h1>📋 ${y} review</h1>
  <p class="sub">${over ? "Year complete." : y === curYear() ? "Year in progress — a preview of how you're doing." : "This year hasn't started yet."}</p>
  <div class="stats" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat"><b>${fg.length}</b><span>Focus goals</span></div>
    <div class="stat"><b>${hit}/${withT.length}</b><span>Targets hit</span></div>
    <div class="stat"><b>${withT.length?Math.round(hit/withT.length*100):0}%</b><span>Hit rate</span></div>
  </div>
  <div class="panel">${rows || `<p class="note">No focus goals were chosen for ${y}.</p>`}</div>
  ${carryable.length ? `<button class="btn" data-act="carryall" data-y="${y}">Carry all ${carryable.length} unfinished to ${ny}</button>` : ""}
  <div class="panel"><b>Notes for ${y}</b><p class="note" style="margin-top:2px">What went well? What will you change?</p>
    <textarea rows="4" data-act="reviewnote" data-y="${y}" placeholder="Write your thoughts…">${esc(state.reviews[y]||"")}</textarea></div>
  <button class="btn alt" data-act="close">Close</button>`;
}

/* ============ Actions ============ */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
const num = id => { const v = $("#"+id).value; return v === "" ? NaN : Number(v); };
function carryGoal(g, y) {
  const ny = y + 1, t = yearTarget(g,y), a = yearAchieved(g,y) || 0;
  g.focus[ny] = true; state.focusMeta[ny] = Date.now();
  if (g.type !== "milestones" && g.type !== "habit" && !(yearTarget(g,ny) > 0) && t > 0) {
    if (g.type === "level") g.targets[ny] = t;
    else if (t - a > 0) g.targets[ny] = t - a;
  }
}

const actions = {
  tab(el){ ui.tab = el.dataset.v; ui.page = null; window.scrollTo(0,0); render(); },
  msub(el){ ui.msub = el.dataset.v; const a = tallyApi(); if (a) a.setTab(el.dataset.v); render(); },
  moneyset(){ const a = tallyApi(); if (a) a.openSettings(); else toast("The money tracker is still loading"); },
  todoset(){ ui.tab = "todosettings"; ui.page = null; window.scrollTo(0,0); render(); },
  vaultset(){ ui.tab = "vaultsettings"; ui.page = null; window.scrollTo(0,0); render(); },
  tsback(){ ui.tab = ui.tab === "todosettings" ? "todo" : "vault"; window.scrollTo(0,0); render(); },
  gsub(el){ ui.gsub = el.dataset.v; window.scrollTo(0,0); render(); },
  back(){ ui.page = null; closeSheet(); render(); },
  gosettings(){ if (ui.tab !== "settings") ui.prevTab = ui.tab; ui.tab = "settings"; ui.page = null; window.scrollTo(0,0); render(); },
  settingsback(){ ui.tab = ui.prevTab || "home"; render(); },
  cat(el){ ui.cat = el.dataset.v; render(); },
  year(el){ ui.year = +el.dataset.v; render(); },
  scope(el){ state.settings.scope = el.dataset.v; save(); render(); },
  gofocus(){ ui.tab = "goals"; ui.gsub = "years"; ui.page = null; ui.year = fy(); window.scrollTo(0,0); render(); },
  gomoney(){ ui.tab = "goals"; ui.gsub = "years"; ui.page = null; ui.year = fy(); render(); const m = document.getElementById("money"); if (m) m.scrollIntoView({block:"start"}); },
  setfocusyear(el){ setFocusYear(+el.dataset.v); },
  togglefocus(el){
    const g = goalById(el.dataset.id), y = +el.dataset.y, on = !isFocus(g,y);
    if (g.status === "Draft") return toast("Promote this draft first");
    setFocus(g, y, on); refresh(); toast(on ? `★ In ${y} focus` : `Removed from ${y} focus`);
  },
  plan(el){ ui.plan = el.dataset.v; ui.cat = "All"; render(); },
  handover(el){ openSheet("handover", el.dataset.v); },
  decide(el){ const g = goalById(el.dataset.id), v = el.dataset.v; g.handover = g.handover === v ? null : v; save(); refresh(); },
  usesuggest(el){
    state.goals.filter(g => g.plan === el.dataset.v && g.status !== "Draft" && g.status !== "Completed" && !g.handover).forEach(g => { g.handover = suggest(g); });
    save(); refresh(); toast("Suggestions applied — adjust any you disagree with");
  },
  async applyhandover(el){
    const pid = el.dataset.v, N = nextPlan(pid);
    const gs = state.goals.filter(g => !g.archived && g.plan === pid && g.status !== "Draft");
    const mk = gs.filter(g => g.handover === "carry" && g.status !== "Completed" && !successorOf(g));
    const dp = gs.filter(g => g.handover === "drop" && g.status !== "On Hold" && g.status !== "Completed");
    if (!(await ask(`Create ${mk.length} draft${mk.length===1?"":"s"} in ${planLabel(N)} and put ${dp.length} dropped goal${dp.length===1?"":"s"} on hold?`, "Apply"))) return;
    mk.forEach(g => state.goals.push(makeSuccessor(g, N)));
    dp.forEach(g => { g.status = "On Hold"; });
    save(); refresh(); toast(`${mk.length} draft${mk.length===1?"":"s"} created in ${planLabel(N)}`);
  },
  mknext(el){
    const g = goalById(el.dataset.id), np = nextPlan(g.plan); if (!np) return;
    ui.prefill = makeSuccessor(g, np); openSheet("edit", null);
  },
  promote(el){
    const g = goalById(el.dataset.id); g.status = g.logs.length ? "In Progress" : "Not Started";
    save(); refresh(); toast("Promoted to an active goal");
  },
  addplan(){
    const age = Number($("#np_age").value), endY = Number($("#np_end").value), last = state.plans[state.plans.length-1];
    const startY = year(last.end) + 1;
    if (!(age > last.age)) return toast(`Age must be above ${last.age}`);
    if (!(endY >= startY)) return toast(`End year must be ${startY} or later`);
    if (state.plans.some(p => p.age === age)) return toast("That age already has a plan");
    state.plans.push({id:"p"+age, age, start:startY+"-01-01", end:endY+"-12-31"}); save(); render(); toast("Plan added");
  },
  delplan(el){

    if (!placed && rows.length) { const last = rows[rows.length - 1]; if (last.nextElementSibling !== d.row) last.after(d.row); }
  });
