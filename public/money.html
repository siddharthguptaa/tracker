  return h<24&&mi<60?pad(h)+':'+pad(mi):'';
}
function planImport(text){return planImportRows(parseCSV(text));}
var HEADS={
  date:['date','day','transaction date','txn date','value date','posting date','booking date','date time','datetime','date and time','date & time','when','created','timestamp','tran date','trans date'],
  time:['time','hour'],
  type:['type','kind','transaction type','txn type','income expense','income or expense','entry type','dr cr','cr dr','debit credit','flow','direction'],
  to:['to account','transfer to','to','destination account','to wallet'],
  acc:['account','from account','wallet','source account','from','account name','bank','bank account','payment method','payment mode','mode','paid from','source'],
  cat:['category','categories','cat','category name','expense category','head','group'],
  amt:['amount','amt','value','sum','total','transaction amount','txn amount','amount inr','amount rs','money','price','cost','inr'],
  inc:['income','credit','deposit','credit amount','deposit amt','deposits','paid in','money in','cr','received','inflow'],
  exp:['expense','debit','withdrawal','debit amount','withdrawal amt','withdrawals','paid out','money out','dr','spent','outflow','payment'],
  note:['note','notes','description','memo','remarks','narration','title','details','particulars','payee','merchant','transaction details','comment','comments','item','remark','reference']
};
function normHead(h){return String(h==null?'':h).toLowerCase().replace(/\([^)]*\)/g,' ').replace(/[._\/\-]+/g,' ').replace(/\s+/g,' ').trim();}
function detectCols(row){
  var head=row.map(normHead),ci={},used={};
  ['date','time','type','to','acc','cat','amt','inc','exp','note'].forEach(function(k){
    ci[k]=-1;for(var i=0;i<head.length;i++){if(!used[i]&&HEADS[k].indexOf(head[i])>=0){ci[k]=i;used[i]=1;break;}}
  });
  return ci;
}
function colsOk(ci){return ci.date>=0&&(ci.amt>=0||ci.inc>=0||ci.exp>=0);}
function findHeaderRow(rows){for(var i=0;i<Math.min(rows.length,30);i++)if(colsOk(detectCols(rows[i])))return i;return -1;}
function planImportRows(rows,opt){
  var hi,ci;
  if(opt){hi=opt.hi;ci=opt.ci;}
  else{hi=findHeaderRow(rows);if(hi<0)return {needMap:true,rows:rows};ci=detectCols(rows[hi]);}
  var data=rows.slice(hi+1);
  if(!data.length)return {error:'No data rows found in that file.'};
  if(!colsOk(ci))return {error:'Couldn’t find a “date” column and an “amount” column.'};
  var items=[],skipped=0,anyNeg=false,hasTypeCol=ci.type>=0,i;
  var parsed=data.map(function(r){
    var cell=function(k){return k>=0&&k<r.length?String(r[k]).trim():'';};
    var d=parseDateStr(cell(ci.date)),cents=NaN,ty='';
    if(ci.amt>=0)cents=toCents(cell(ci.amt));
    else{var inc=toCents(cell(ci.inc)),exp=toCents(cell(ci.exp));if(inc>0){cents=inc;ty='i';}else if(exp>0){cents=exp;ty='e';}}
    if(cents<0)anyNeg=true;
    var tyRaw=cell(ci.type).toLowerCase();
    if(/transfer|xfer|trf/.test(tyRaw))ty='x';
    else if(/income|credit|deposit|\bcr\b|\bin\b/.test(tyRaw))ty='i';
    else if(/expense|debit|withdraw|spend|\bdr\b|\bout\b/.test(tyRaw))ty='e';
    return {d:d,cents:cents,ty:ty,tm:parseTimeStr(cell(ci.time))||parseTimeStr(cell(ci.date))||(/^\d{5}\.\d+$/.test(cell(ci.date))?parseTimeStr('.'+cell(ci.date).split('.')[1]):''),acc:cell(ci.acc),to:cell(ci.to),cat:cell(ci.cat),n:cell(ci.note)};
  });
  var assumedExpense=!hasTypeCol&&ci.amt>=0&&!anyNeg;
  parsed.forEach(function(p){
    if(!p.d||isNaN(p.cents)||p.cents===0){skipped++;return;}
    var t=p.ty;
    if(!t)t=p.cents<0?'e':(assumedExpense?'e':'i');
    items.push({t:t,a:Math.abs(p.cents),acc:p.acc,to:p.to,cat:p.cat,n:p.n,d:p.d,tm:p.tm||'12:00'});
  });
  if(!items.length)return {error:'None of the rows could be read. Check that dates look like 2026-11-06 or 06/11/2026 and amounts are numbers.'};
  var newAcc={},newCat={};
  function accKnown(n){return D.accounts.some(function(a){return a.name.toLowerCase()===n.toLowerCase();});}
  items.forEach(function(it){
    if(!it.acc)it.acc=D.accounts[0]?D.accounts[0].name:'Cash';
    if(!accKnown(it.acc))newAcc[it.acc.toLowerCase()]=it.acc;
    if(it.t==='x'){if(!it.to)it.to=it.acc;if(!accKnown(it.to))newAcc[it.to.toLowerCase()]=it.to;}
    else{
      var type=it.t==='i'?'income':'expense';if(!it.cat)it.cat='Other';
      var known=D.categories.some(function(c){return c.type===type&&c.name.toLowerCase()===it.cat.toLowerCase();});
      if(!known)newCat[type+':'+it.cat.toLowerCase()]={name:it.cat,type:type};
    }
  });
  return {items:items,skipped:skipped,newAcc:Object.keys(newAcc).map(function(k){return newAcc[k];}),newCat:Object.keys(newCat).map(function(k){return newCat[k];}),assumedExpense:assumedExpense};
}
function commitImport(plan){

  ex.cat.forEach(function(x){if(!D.categories.some(function(c){return c.type===x.type&&c.name.toLowerCase()===x.name.toLowerCase();}))D.categories.push({id:uid(),name:x.name,type:x.type,icon:x.icon||'⭐',color:/^#[0-9a-f]{6}$/i.test(x.color)?x.color:COLORS[(D.categories.length*3+ci++)%COLORS.length],off:x.off?true:undefined});});
  function acc(name){
    var a=D.accounts.filter(function(x){return x.name.toLowerCase()===name.toLowerCase();})[0];

    if(!c){c={id:uid(),name:name,type:type,icon:'⭐',color:COLORS[(D.categories.length*3+ci++)%COLORS.length]};D.categories.push(c);}

  });
  var nb=0;
  ex.bud.forEach(function(x){
    var c=D.categories.filter(function(k){return k.type==='expense'&&k.name.toLowerCase()===x.cat.toLowerCase();})[0];
    if(c&&!D.budgets.some(function(b){return b.c===c.id&&(b.m||'')===x.m;})){D.budgets.push({id:uid(),c:c.id,l:x.l,m:x.m});nb++;}
  });
  var extra=0;
  (ex.rec||[]).forEach(function(x){
    var c=D.categories.filter(function(k){return k.name.toLowerCase()===x.cat.toLowerCase();})[0];
    if(!c&&x.cat)c={id:cat(x.cat,'expense')};
    var a=x.acc?{id:acc(x.acc)}:D.accounts[0];
    if(c&&a&&D.categories.some(function(k){return k.id===c.id;})){D.recurring.push({id:uid(),on:!x.paused,name:x.name,a:x.a,c:c.id,ac:a.id,freq:x.freq,next:x.next,day:+x.next.slice(8),end:x.end,auto:x.auto});extra++;}
  });
  (ex.sg||[]).forEach(function(x){D.sgoals.push({id:uid(),name:x.name,target:x.target,due:x.due,icon:'🎯',gid:x.gid||undefined,contrib:x.hist.map(function(h){return {id:uid(),d:h.d,a:h.a,n:h.n};})});extra++;});
  (ex.loan||[]).forEach(function(x){var o={id:uid(),kind:x.kind,name:x.name,icon:x.kind==='card'?'💳':'🏦'};
    if(x.kind==='card')Object.assign(o,{limit:x.limit,used:x.used,dueDay:x.dueDay});else Object.assign(o,{p:x.p,rate:x.rate,n:x.n,start:x.start,emi:x.emi,emiSet:x.emiSet,pre:x.pre});
    D.loans.push(o);extra++;});
  reindex();try{processRecurring();}catch(e){}save();render(true);refreshPrefs();toast(plan.items.length+' records'+(nb?', '+nb+' budgets':'')+(extra?', '+extra+' plan items':'')+' imported');
}

function openColumnMapper(rows){
  var ncol=0,guess=0,i;rows.slice(0,40).forEach(function(r){if(r.length>ncol)ncol=r.length;});
  for(i=0;i<Math.min(15,rows.length);i++){var ne=rows[i].filter(function(c){return String(c).trim()!=='';}).length;if(ne>=3){guess=i;break;}}
  var ci=detectCols(rows[guess]||[]);
  function colScore(c,fn){var n=0,good=0,k;for(k=guess+1;k<Math.min(rows.length,guess+30);k++){var v=String(rows[k][c]==null?'':rows[k][c]).trim();if(v==='')continue;n++;if(fn(v))good++;}return n?good/n:0;}
  if(ci.date<0)for(i=0;i<ncol;i++)if(colScore(i,function(v){return !!parseDateStr(v);})>=0.7){ci.date=i;break;}
  if(ci.amt<0&&ci.inc<0&&ci.exp<0)for(i=0;i<ncol;i++)if(i!==ci.date&&colScore(i,function(v){return !isNaN(toCents(v));})>=0.7){ci.amt=i;break;}
  var FIELDS=[['date','Date *'],['amt','Amount'],['inc','Income amount (if separate)'],['exp','Expense amount (if separate)'],['type','Type (income / expense / transfer)'],['acc','Account'],['to','To account (transfers)'],['cat','Category'],['note','Note'],['time','Time']];
  function sample(c){for(var k=guess+1;k<rows.length;k++){var v=String(rows[k][c]==null?'':rows[k][c]).trim();if(v)return v.length>18?v.slice(0,18)+'…':v;}return '';}
  function opts(sel){var h='<option value="-1">— none —</option>';for(var c=0;c<ncol;c++){var tt=String((rows[guess]||[])[c]||'').trim(),sm=sample(c);h+='<option value="'+c+'"'+(sel===c?' selected':'')+'>'+esc((tt||('Column '+(c+1)))+(sm?'  ·  e.g. '+sm:''))+'</option>';}return h;}
  var id=cb(function(){
    var l=topLayer(),map={};FIELDS.forEach(function(f){map[f[0]]=+$('#mp-'+f[0],l).value;});
    var tr=parseInt($('#mp-row',l).value,10)||0;
    if(!colsOk(map)){$('#mp-e',l).textContent='Pick a Date column and an Amount column (or separate Income / Expense columns).';return;}
    closeTop();showImportPlan(planImportRows(rows,{hi:tr-1,ci:map}));
  });
  openSheet('<h3>Match your columns</h3><p class="note" style="padding-top:0">Money couldn’t recognise the column titles in this file. Tell it which column is which. You’ll see a preview before anything is added.</p>'+
    '<label class="field"><span>Row that holds the column titles (0 if there are none)</span><input type="number" id="mp-row" min="0" max="'+rows.length+'" value="'+(rows.length?guess+1:0)+'"></label>'+
    FIELDS.map(function(f){return '<label class="field"><span>'+f[1]+'</span><select id="mp-'+f[0]+'">'+opts(ci[f[0]])+'</select></label>';}).join('')+
    '<div class="err" id="mp-e"></div><div class="srow"><button class="btn" data-act="closeTop">Cancel</button><button class="btn primary" data-act="cb" data-cb="'+id+'" data-v="1">Preview</button></div>');
}
function dedupePlan(plan){
  if(plan._dd||!plan.items)return;plan._dd=1;
  var seen={};
  D.records.forEach(function(r){var a=IDX.acc[r.ac],to=IDX.acc[r.to];seen[[r.d,r.t,r.a,a?a.name.toLowerCase():'',to?to.name.toLowerCase():'',String(r.n||'').trim().toLowerCase()].join('|')]=1;});
  var keep=[],dup=0;
  plan.items.forEach(function(it){var k=[it.d,it.t,it.a,String(it.acc).toLowerCase(),it.t==='x'?String(it.to).toLowerCase():'',String(it.n||'').trim().toLowerCase()].join('|');if(seen[k]){dup++;return;}seen[k]=1;keep.push(it);});
  plan.items=keep;plan.dups=dup;
}
function showImportPlan(plan){
  if(plan.needMap){openColumnMapper(plan.rows);return;}

  if(!plan.error&&!plan.items.length&&!(plan.ex&&(plan.ex.acc.length||plan.ex.cat.length||plan.ex.bud.length||plan.ex.rec.length||plan.ex.sg.length||plan.ex.loan.length))){
    openSheet('<h3>Nothing new to import</h3><p class="note" style="padding-top:0">'+(plan.dups?'All '+plan.dups+' records in this file are already in Money.':'No rows could be added.')+'</p><div class="srow"><button class="btn primary" data-act="closeTop">OK</button></div>');return;
  }
  if(plan.error){openSheet('<h3>Can’t import this file</h3><p class="note" style="padding-top:0">'+esc(plan.error)+'</p><div class="srow"><button class="btn primary" data-act="closeTop">OK</button></div>');return;}
  var id=cb(function(){closeTop();commitImport(plan);});
  var ex0=plan.ex||{acc:[],cat:[],bud:[],rec:[],sg:[],loan:[]};
  var sample=plan.items.slice(0,4).map(function(it){return '<div class="kv" style="padding:6px 18px"><span>'+esc(it.d)+' · '+esc(it.t==='x'?'Transfer':it.cat)+'</span><b class="'+(it.t==='e'?'exp':it.t==='i'?'inc':'')+'">'+esc(money(it.t==='e'?-it.a:it.a))+'</b></div>';}).join('');
  openSheet('<h3>Import preview</h3>'+
    '<div class="kv"><span>Records to add</span><b>'+plan.items.length+'</b></div>'+(plan.skipped?'<div class="kv"><span>Rows skipped (no valid date or amount)</span><b>'+plan.skipped+'</b></div>':'')+
    (plan.newAcc.length?'<div class="kv"><span>New accounts</span><b>'+esc(plan.newAcc.slice(0,4).join(', '))+(plan.newAcc.length>4?'…':'')+'</b></div>':'')+

    (plan.assumedExpense?'<p class="note">There’s no type column and no negative amounts, so every row is treated as an <b>expense</b>.</p>':'')+
    '<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px">'+sample+'</div>'+
    '<div class="srow"><button class="btn" data-act="closeTop">Cancel</button><button class="btn primary" data-act="cb" data-cb="'+id+'" data-v="1">'+(plan.items.length?'Import '+plan.items.length:'Import')+'</button></div>');

function addSample(){
  var seed=7;function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;}
  function cid(name,type){var c=D.categories.filter(function(x){return x.name===name&&x.type===type;})[0];return c?c.id:'';}
  var cash=(D.accounts.filter(function(a){return a.name==='Cash';})[0]||D.accounts[0]),card=(D.accounts.filter(function(a){return a.name==='Card';})[0]||D.accounts[0]),sav=(D.accounts.filter(function(a){return a.name==='Savings';})[0]||D.accounts[0]);
  if(!cash){toast('Add an account first');return;}
  var now=new Date(),today=todayISO(),n=0;
  for(var back=2;back>=0;back--){
    var d0=new Date(now.getFullYear(),now.getMonth()-back,1),y=d0.getFullYear(),m=d0.getMonth(),dim=new Date(y,m+1,0).getDate();
    var add=function(day,t,amt,cat,acct,note){
      if(day>dim)return;var date=y+'-'+pad(m+1)+'-'+pad(day);if(date>today)return;
      var c=t==='x'?'':cid(cat,t==='i'?'income':'expense');if(t!=='x'&&!c)return;
      D.records.push({id:uid(),t:t,a:Math.round(amt*100),ac:acct.id,to:t==='x'?sav.id:'',c:c,n:note||'',d:date,tm:pad(8+Math.floor(rnd()*13))+':'+pad(Math.floor(rnd()*60)),cr:Date.now()+n});n++;
    };
    add(1,'i',60000,'Salary',card,'Monthly salary');
    add(2,'x',10000,'',card,'Move to savings');
    add(3,'e',8000,'Rent',card,'Rent');
    add(5,'e',Math.round(500+rnd()*500),'Mobile',card,'Phone recharge');
    add(10,'e',Math.round(1500+rnd()*3000),'Shopping',card,'');
    add(12,'e',Math.round(500+rnd()*1200),'Health',cash,'Pharmacy');
    for(var d=1;d<=dim;d++){
      if(rnd()<0.45)add(d,'e',Math.round((60+rnd()*420)/5)*5,'Eating out',cash,['Lunch','Snacks','Chai','Dinner'][Math.floor(rnd()*4)]);
      if(rnd()<0.22)add(d,'e',Math.round((50+rnd()*400)/5)*5,'Transportation',cash,rnd()<.5?'Metro':'Cab');
    }
  }
  var has={};activeBudgets(S.month).forEach(function(b){has[b.c]=1;});
  [['Eating out',5000],['Transportation',3000],['Shopping',4000]].forEach(function(b){var c=cid(b[0],'expense');if(c&&!has[c])D.budgets.push({id:uid(),c:c,l:b[1]*100,m:''});});
  save();render(true);refreshPrefs();toast('Sample data added');
}

function tipHtml(){
  if(S.tab!=='records'||S.selMode||swipeTipSeen()||!D.records.length)return '';
  return '<div class="tipc" role="note"><b>Quick actions</b>'+(D.settings.swipe!==false?'Swipe a record <b style="display:inline">left to delete</b> or <b style="display:inline">right to copy</b>. ':'')+'Press and hold a record to select several. Every delete can be undone.<br><button data-act="tipOk">Got it</button></div>';
}
ACT.tipOk=function(){try{localStorage.setItem('tally:tip:swipe','1');}catch(e){}render(true);};
ACT.selStart=function(){closeTop();enterSel('');};
ACT.selExit=function(){exitSel();};
ACT.selTog=function(el){var id=el.dataset.id;if(S.sel[id])delete S.sel[id];else S.sel[id]=1;render(true);};
ACT.selAll=function(){
  var vis=baseRecs(),all=vis.length&&vis.every(function(r){return S.sel[r.id];});
  S.sel={};if(!all)vis.forEach(function(r){S.sel[r.id]=1;});render(true);
};
function selRecs(){return D.records.filter(function(r){return S.sel[r.id];});}
ACT.selMenu=function(){
  var rs=selRecs();if(!rs.length){toast('Select at least one record');return;}
  var n=rs.length,types={},hasX=false;rs.forEach(function(r){types[r.t]=1;if(r.t==='x')hasX=true;});
  var tk=Object.keys(types),catOk=tk.length===1&&tk[0]!=='x';
  var items=[
    {l:catOk?'Change category':'Change category (select only expenses, or only income)',fn:function(){
      if(!catOk){toast('Select only expenses, or only income, to change category');return;}
      var type=tk[0]==='i'?'income':'expense';
      var opts=D.categories.filter(function(c){return c.type===type&&!c.off;}).sort(byPin).map(function(c){return {v:c.id,l:(c.pin?'\uD83D\uDCCC ':'')+c.name,icon:c.icon,color:c.color};});
      if(!opts.length){toast('Add a '+type+' category first');return;}
      choiceSheet('Move '+n+' record'+(n===1?'':'s')+' to category…',opts,'',function(v){
        var t=IDX.cat[v];if(!t)return;var b=snapU();
        D.records.forEach(function(r){if(S.sel[r.id])r.c=v;});
        save();S.selMode=false;S.sel={};notifyLayers();render(true);undoable(n+' record'+(n===1?'':'s')+' moved to '+t.name,b);
      });}},
    {l:'Change account',fn:function(){
      var opts=D.accounts.map(accOpt);
      choiceSheet('Move '+n+' record'+(n===1?'':'s')+' to account…',opts,'',function(v){
        if(!IDX.acc[v])return;var b=snapU(),skip=0;
        D.records.forEach(function(r){if(!S.sel[r.id])return;if(r.t==='x'&&r.to===v){skip++;return;}r.ac=v;});
        save();S.selMode=false;S.sel={};notifyLayers();render(true);undoable((n-skip)+' record'+((n-skip)===1?'':'s')+' moved to '+IDX.acc[v].name+(skip?' · '+skip+' transfer'+(skip===1?'':'s')+' left as is':''),b);
      });}}
  ];
  if(BK.list.length>1)items.push({l:'Move to another book…',fn:function(){
    var opts=BK.list.filter(function(b){return b.id!==BK.active;}).map(function(b){var l=bookLook(b);return {v:b.id,l:b.name,icon:l.icon,color:l.color};});
    choiceSheet('Move '+n+' record'+(n===1?'':'s')+' to book…',opts,'',function(v){moveToBook(v);});}});
  items.push({l:'Delete '+n+' record'+(n===1?'':'s'),danger:true,fn:function(){var ids=Object.assign({},S.sel);S.selMode=false;S.sel={};notifyLayers();deleteRecords(ids);}});
  menuSheet(n+' selected',items);
};
function moveToBook(tid){
  var tb=BK.list.filter(function(x){return x.id===tid;})[0],rs=selRecs();if(!tb||!rs.length)return;
  var n=rs.length;
  confirmSheet('Move '+n+' record'+(n===1?'':'s')+' to \u201C'+tb.name+'\u201D?','Accounts and categories with the same name are reused there; missing ones are created. Balances in both books change. You can undo for a few seconds.','Move',function(){
    var raw=null,T;try{raw=localStorage.getItem(tb.key);}catch(e){}
    try{T=raw?sanitize(JSON.parse(raw)):defaultData();}catch(e){T=defaultData();}
    var before=snapU(),am={},cm={};
    function mapAcc(id){
      if(!id)return '';if(am[id])return am[id];var a=IDX.acc[id];if(!a)return '';
      var m=T.accounts.filter(function(x){return String(x.name).toLowerCase()===String(a.name).toLowerCase();})[0];
      if(!m){m=JSON.parse(JSON.stringify(a));m.id=uid();m.open=0;T.accounts.push(m);}
      am[id]=m.id;return m.id;
    }
    function mapCat(id){
      if(!id)return '';if(cm[id])return cm[id];var c=IDX.cat[id];if(!c)return '';
      var m=T.categories.filter(function(x){return x.type===c.type&&String(x.name).toLowerCase()===String(c.name).toLowerCase();})[0];
      if(!m){m=JSON.parse(JSON.stringify(c));m.id=uid();delete m.pin;delete m.off;T.categories.push(m);}
      cm[id]=m.id;return m.id;
    }
    var have={};T.records.forEach(function(r){have[r.id]=1;});
    rs.forEach(function(r){
      var c=JSON.parse(JSON.stringify(r));c.ac=mapAcc(r.ac);if(r.t==='x')c.to=mapAcc(r.to);else c.c=mapCat(r.c);
      delete c.rc;if(have[c.id])c.id=uid();have[c.id]=1;T.records.push(c);
    });
    try{localStorage.setItem(tb.key,JSON.stringify(T));}catch(e){toast('Not enough storage to move these');return;}
    var ids=Object.assign({},S.sel);
    D.records=D.records.filter(function(r){return !ids[r.id];});
    save();S.selMode=false;S.sel={};notifyLayers();render(true);
    toast(n+' record'+(n===1?'':'s')+' moved to \u201C'+tb.name+'\u201D',{label:'Undo',fn:function(){
      try{if(raw===null)localStorage.removeItem(tb.key);else localStorage.setItem(tb.key,raw);}catch(e){}
      restoreU(before);
    }});
  });
}

/* ----- gestures: long-press selects, swipe left deletes, swipe right copies ----- */
(function(){
  var g=null,MIN=84,EDGE=20;
  function wrapOf(t){return t&&t.closest?t.closest('.recw'):null;}
  function reset(w){if(!w)return;var sl=w.querySelector('.rsl');if(sl)sl.style.transform='';w.classList.remove('swiping','toL','toR','armed');}
  document.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var w=wrapOf(e.target);
    if(!w||S.tab!=='records'||L.length||lockApi)return;
    if(e.target.closest('.rcopy'))return;
    g={w:w,id:w.dataset.rid,x:e.clientX,y:e.clientY,dx:0,mode:'',pid:e.pointerId,edge:e.clientX<EDGE||e.clientX>(window.innerWidth||9999)-EDGE};
    var me=g;
    g.t=setTimeout(function(){
      if(g!==me||me.mode)return;
      me.mode='lp';S.supClick=Date.now()+700;S.supId=me.id;
      try{if(navigator.vibrate)navigator.vibrate(15);}catch(x){}
      if(S.selMode){if(S.sel[me.id])delete S.sel[me.id];else S.sel[me.id]=1;render(true);}else enterSel(me.id);
    },480);
  },{passive:true});
  document.addEventListener('pointermove',function(e){
    if(!g||e.pointerId!==g.pid)return;
    var dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(!g.mode){
      if(Math.abs(dy)>10||Math.abs(dx)>10){
        clearTimeout(g.t);
        if(Math.abs(dx)>Math.abs(dy)*1.4&&!g.edge&&!S.selMode&&D.settings.swipe!==false){g.mode='sw';g.w.classList.add('swiping');try{g.w.setPointerCapture(g.pid);}catch(x){}}
        else{g=null;return;}
      }else return;
    }
    if(g.mode==='sw'){
      g.dx=dx;var sl=g.w.querySelector('.rsl');if(sl)sl.style.transform='translateX('+Math.max(-150,Math.min(150,dx))+'px)';
      g.w.classList.toggle('toL',dx<0);g.w.classList.toggle('toR',dx>0);g.w.classList.toggle('armed',Math.abs(dx)>=MIN);
    }
  },{passive:true});
  function end(cancel){
    if(!g)return;var me=g;g=null;clearTimeout(me.t);
    if(me.mode==='sw'){
      S.supClick=Date.now()+300;S.supId=me.id;
      var dx=me.dx;reset(me.w);
      if(!cancel&&Math.abs(dx)>=MIN){
        if(dx<0){var o={};o[me.id]=1;deleteRecords(o);}
        else ACT.copyRow({dataset:{id:me.id}});
      }
    }else if(me.mode==='lp'){S.supClick=Date.now()+300;S.supId=me.id;}
  }
  document.addEventListener('pointerup',function(){end(false);},true);
  document.addEventListener('pointercancel',function(){end(true);},true);
  document.addEventListener('contextmenu',function(e){if(wrapOf(e.target))e.preventDefault();});
  document.addEventListener('click',function(e){if(S.supClick&&Date.now()<S.supClick&&wrapOf(e.target)&&wrapOf(e.target).dataset.rid===S.supId){S.supClick=0;e.stopPropagation();e.preventDefault();}},true);
})();

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var fn=ACT[el.dataset.act];if(fn)fn(el,ev);
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.search=e.target.value;renderHeader();renderList();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='x-range'){X.range=t.value;if(X.range==='custom'&&!X.from){X.from=S.month+'-01';X.to=todayISO();}refreshPrefs();}
  else if(t.id==='x-from'){X.from=t.value;refreshPrefs();}
  else if(t.id==='x-to'){X.to=t.value;refreshPrefs();}
  else if((t.id==='csv-file'||t.id==='xl-file')&&t.files&&t.files[0]){importAny(t.files[0]);t.value='';}
});
document.addEventListener('keydown',function(e){
  if(lockApi)return;
  if(e.key==='Escape'&&L.length){e.preventDefault();closeTop();return;}
  var top=topLayer();
  if(E&&top&&top.querySelector('.editor')){
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||e.ctrlKey||e.metaKey||e.altKey)return;
    var k=e.key,map={'*':'×','/':'÷','x':'×'};
    if(/^[0-9.+\-]$/.test(k)||map[k]){e.preventDefault();keyPress(map[k]||k);fillAmt();}
    else if(k==='Enter'||k==='='){e.preventDefault();keyPress('=');fillAmt();}
    else if(k==='Backspace'){e.preventDefault();keyPress('back');fillAmt();}
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return;}
  if(D.settings.pin&&!lockApi&&hiddenAt&&(Date.now()-hiddenAt)>=D.settings.lockAfter*1000)lockApp();
  try{if(!D.settings.pin||!lockApi){if(processRecurring())render(true);}}catch(e){}
  renderNudge();
});

if(window.parent!==window){['pointerdown','touchend','keydown'].forEach(function(ev){window.addEventListener(ev,function(){try{parent.__armBack&&parent.__armBack();}catch(e){}},true);});}  /* lets the Tracker add its Back guard after the first tap inside Money */
window.TallyAPI={
  bookId:function(){return BK.active;},
  search:function(q){while(L.length)closeTop();S.selMode=false;S.sel={};notifyLayers();S.tab='records';S.searchOpen=true;S.search=String(q||'');S.filter=emptyFilter();render();var i=$('#q');if(i)i.value=S.search;},
  getTab:function(){return S.tab;},
  setTab:function(t){while(L.length)closeTop();if(S.selMode){S.selMode=false;S.sel={};notifyLayers();}if(S.tab!==t){S.tab=t;S.searchOpen=false;S.search='';}render();},
  openSettings:function(){if(!lockApi)ACT.openSettings();},
  applyTheme:function(){applyTheme();render(true);},
  back:function(){if(L.length){closeTop();return true;}if(S.selMode){exitSel();return true;}return false;},
  bookName:function(){return curBook().name;},
  switchBook:function(id){if(lockApi)return false;switchBook(id);return true;},
  bookCount:function(){return BK.list.length;},
  setHide:function(v){D.settings.hide=!!v;S.reveal=false;render(true);refreshPrefs();},
  markBackup:function(){D.meta.lastBackup=new Date().toISOString();save();},
  addRecord:function(t){if(lockApi)return false;while(L.length)closeTop();if(S.tab!=='records'){S.tab='records';S.searchOpen=false;S.search='';}render();openEditor(null);if(t==='i')ACT.etype({dataset:{t:'i'}});return true;}
};
D=load();
reindex();
try{processRecurring();}catch(e){}
applyTheme();
render();
if(!storageOK)toast('This browser is blocking storage, so nothing you add will be kept. Open Money in your normal browser.');
if(D.settings.pin)lockApp();
restoreDraft();

})();
