<!doctype html>
<html lang="en" data-theme="tally" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<title>Money tracker</title>
<script>
/* Colours come from the host app (same palette, light/dark and accent as Goals); fall back to the app's own when opened alone. */
(function(){
  var r=document.documentElement;
  try{
    var p=window.parent;
    if(p&&p!==window&&p.tallyThemeVars){
      var v=p.tallyThemeVars();
      for(var k in v){if(k.indexOf('--')===0&&k!=='--dark')r.style.setProperty(k,v[k]);}
      r.setAttribute('data-theme','tally');r.setAttribute('data-mode',v['--dark']==='1'?'dark':'light');r.style.colorScheme=v['--dark']==='1'?'dark':'light';
      return;
    }
  }catch(e){}
  var theme='tally',mode='system';
  try{var bk0=JSON.parse(localStorage.getItem('tally:books:v1')),k0='tally:app:v1';if(bk0&&bk0.list){var b0=bk0.list.filter(function(x){return x.id===bk0.active;})[0];if(b0&&b0.key)k0=b0.key;}var d=JSON.parse(localStorage.getItem(k0));if(d&&d.settings){theme=d.settings.theme||theme;mode=d.settings.mode||mode;}}catch(e){}
  var dark=mode==='dark'||(mode==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme',theme);r.setAttribute('data-mode',dark?'dark':'light');
})();
</script>
<style>
/* ---------- theme tokens ---------- */
:root{
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --accent-soft:#eceafd;--shadow:0 1px 2px rgba(20,21,31,.06),0 4px 14px rgba(20,21,31,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F4;--bar:#FFFFFF;--surface:#FFFFFF;--soft:#F2F5F7;--ink:#16202A;--muted:#5B6875;--line:#D8DEE3;
  --accent:#2F45B5;--on-accent:#FFFFFF;--income:#17795A;--expense:#BE4330;--track:#E3E8EC;--scrim:rgba(10,16,22,.52);
  --vvt:0px;--vvh:100%;
  color-scheme:light;
}
html[data-theme="tally"][data-mode="dark"]{
  --bg:#0F151B;--bar:#172029;--surface:#172029;--soft:#1D2832;--ink:#E7ECF0;--muted:#93A1AD;--line:#2A3641;
  --accent:#93A2FF;--on-accent:#0F151B;--income:#4CC39B;--expense:#F0866F;--track:#2A3641;color-scheme:dark;
}
html[data-theme="classic"][data-mode="light"]{
  --bg:#F5F2E3;--bar:#E8E2C0;--surface:#FFFDF0;--soft:#F0ECD3;--ink:#2B2A1E;--muted:#6F6A4E;--line:#D6CF9F;
  --accent:#8A6A00;--on-accent:#FFF8D6;--income:#2E7D4F;--expense:#C0472B;--track:#E4DEB6;
}
html[data-theme="classic"][data-mode="dark"]{
  --bg:#404040;--bar:#57564F;--surface:#4A473A;--soft:#4F4B3D;--ink:#FFF4BE;--muted:#C4BF98;--line:#A9A27A;
  --accent:#FFD800;--on-accent:#2A2400;--income:#7DD08E;--expense:#FF8F70;--track:#6A664F;color-scheme:dark;
}
html[data-theme="teal"][data-mode="light"]{
  --bg:#ECF3F2;--bar:#FFFFFF;--surface:#FFFFFF;--soft:#F1F7F6;--ink:#10201F;--muted:#4F6664;--line:#D2E0DE;
  --accent:#0E7C7B;--on-accent:#FFFFFF;--income:#1B7F4B;--expense:#BE4330;--track:#DDE9E7;
}
html[data-theme="teal"][data-mode="dark"]{
  --bg:#0D1616;--bar:#14201F;--surface:#14201F;--soft:#1B2B2A;--ink:#E3F1EF;--muted:#8FA9A6;--line:#263A38;
  --accent:#5ED1CF;--on-accent:#0D1616;--income:#4CC39B;--expense:#F0866F;--track:#263A38;color-scheme:dark;
}

/* ---------- base ---------- */
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bar);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.display{font-family:var(--font)}
.inc{color:var(--income)}.exp{color:var(--expense)}.mut{color:var(--muted)}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.hdr{flex:none;background:var(--bar);border-bottom:1px solid var(--line)}
.appbar{display:flex;align-items:center;height:56px;padding:0 4px}
.appbar .title{flex:1;font:700 25px/1 var(--font);letter-spacing:-.02em;margin-left:6px}
.ibtn{width:48px;height:48px;border:0;border-radius:24px;background:none;display:grid;place-items:center;color:var(--ink);position:relative}
.ibtn:active{background:var(--soft)}
.ibtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn .dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bar)}
.searchrow{padding:0 12px 10px}
.searchrow input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px}
.monthbar{display:flex;align-items:center;justify-content:center;height:48px;position:relative}
.monthbar .lbl{min-width:170px;text-align:center;font:600 18px var(--font)}
.monthbar .right{position:absolute;right:4px;top:0}
.strip{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));text-align:center;padding:4px 8px 12px;gap:4px}
.strip .k{font-size:13px;color:var(--muted)}
.strip .v{font:600 clamp(15px,4.5vw,18px)/1.25 var(--font);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stripwide{text-align:center;font:600 20px var(--font);padding:6px 12px 2px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 12px;border-radius:16px;background:var(--soft);border:1px solid var(--line);font-size:13px}
.chip button{border:0;background:none;width:28px;height:28px;border-radius:14px;color:var(--muted);font-size:16px;line-height:1}

main#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 0 96px;-webkit-overflow-scrolling:touch}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bar);border-top:1px solid var(--line)}
.tabs{display:none!important}
.stabs{display:flex;padding:0 4px;border-top:1px solid var(--line)}
.stab{flex:1;min-width:0;background:none;border:0;border-bottom:2.5px solid transparent;padding:12px 2px 11px;font:600 12.5px/1.1 var(--font);letter-spacing:-.01em;color:var(--muted);white-space:nowrap;cursor:pointer}
.stab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.setlist .brand{padding:20px 20px 10px}
.setlist .brand b{display:block;font:700 26px var(--font);letter-spacing:-.02em}
.setlist .grp{padding:16px 20px 4px;color:var(--muted);font-size:14px}
.setlist .sopt{min-height:56px;padding:6px 20px}
.setlist .sopt svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.setlist hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.tab{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;font-size:12px;font-weight:500}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.2}
.fab{position:absolute;right:16px;bottom:22px;width:58px;height:58px;border-radius:29px;border:0;background:var(--accent);color:var(--on-accent);
  font-size:32px;line-height:1;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:5;padding:0 0 3px}
.fab:active{transform:scale(.96)}
#nudge{position:absolute;left:12px;right:12px;bottom:76px;z-index:6}
.nudgebar{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 14px;box-shadow:0 8px 22px rgba(0,0,0,.3);font-size:14px}
.nudgebar span{flex:1}
.nudgebar button{border:0;background:none;color:inherit;font-weight:600;min-height:40px;padding:0 10px;border-radius:8px}

/* ---------- rows ---------- */
.dayh{margin:18px 14px 0;padding-bottom:6px;border-bottom:1px solid var(--line);font:600 16px var(--font)}
.sech{margin:20px 14px 6px;padding-bottom:6px;border-bottom:1px solid var(--line);font:600 18px var(--font)}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;flex:none;color:#fff}
.ico.sm{width:26px;height:26px;font-size:14px;border-radius:7px}
.ico.sq{border-radius:12px}
.rec{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 14px;min-height:64px}
.rec:active{background:var(--soft)}
.rcopy{flex:none;width:44px;height:44px;margin-right:4px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:50%;opacity:.75}
.rcopy svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rcopy:active{background:var(--soft);color:var(--accent);opacity:1}
@media(max-width:380px){.rcopy{width:40px;height:40px;margin-right:0}.rcopy svg{width:17px;height:17px}.rsl>.rec{padding-right:6px}}
@media(hover:hover){.rcopy:hover{background:var(--soft);color:var(--accent);opacity:1}}
.rec .mid{flex:1;min-width:0;padding-bottom:0}
.rec .t1{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t2{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13.5px;min-width:0}
.rec .t3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;overflow-wrap:anywhere;word-break:break-word;color:var(--ink);opacity:.82;font-size:13.5px;line-height:1.32;margin:1px 0 3px}
.rec .t2 .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rec .amt{font:600 17px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.recw+.recw{background-image:linear-gradient(var(--line),var(--line));background-size:calc(100% - 72px) 1px;background-position:right top;background-repeat:no-repeat}
.rec+.rec{background-image:linear-gradient(var(--line),var(--line));background-size:calc(100% - 72px) 1px;background-position:right top;background-repeat:no-repeat}
.empty{padding:44px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 19px var(--font);margin-bottom:6px}
.empty .btn{margin-top:16px}

.btn{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--expense);border-color:var(--expense)}
.btn.danger.fill{background:var(--expense);color:#fff}
.btn.wide{display:block;width:calc(100% - 28px);margin:16px 14px 0}
.btn.outline{background:none;border:1.5px solid var(--accent);color:var(--ink)}

/* ---------- analysis ---------- */
.dd{display:block;margin:16px auto 8px;min-height:48px;padding:0 20px;border:1.5px solid var(--accent);border-radius:10px;background:none;font:600 15px var(--font);letter-spacing:.02em}
.donutrow{display:flex;align-items:center;gap:8px;padding:6px 14px 10px}
.donutrow svg{flex:none;width:46%;max-width:210px;height:auto}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.arow:active{background:var(--soft)}
.arow .mid{flex:1;min-width:0}
.arow .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.arow .l1 .a{font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;border:1.5px solid var(--accent);margin-top:6px;overflow:hidden;background:none}
.bar>i{display:block;height:100%;background:var(--accent);opacity:.55}
.arow .pct{width:58px;text-align:right;font:600 16px var(--font);font-variant-numeric:tabular-nums}
.trend{padding:8px 14px}
.trend svg{width:100%;height:auto;display:block}
.trow{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.trow:first-child{text-align:right}
.trow b{font-weight:600}
.trow span:first-child{text-align:left}
.trow.head{color:var(--muted);font-size:12.5px;border-top:0}


/* ---------- insights ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 0}
.kpi{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font:700 clamp(15px,4.7vw,19px) var(--font);font-variant-numeric:tabular-nums;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .d{font-size:12.5px;margin-top:2px;color:var(--muted)}
.ibox{padding:12px 14px;border-top:1px solid var(--line)}
.ibox:first-child{border-top:0}
.ibox h4{margin:0 0 8px;font:600 15px var(--font)}
.ibox .sub{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.ibox svg{width:100%;height:auto;display:block}
.hrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.hrow .n{width:44px;color:var(--muted)}
.hrow .t{flex:1;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.hrow .t>i{display:block;height:100%;background:var(--accent);opacity:.6;border-radius:6px}
.hrow .t>i.hi{background:var(--expense);opacity:.85}
.hrow .a{min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.tip{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4}
.tip:first-child{border-top:0}
.tip b{font-weight:600}
.mv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 0;font-size:14.5px}
.mv .mid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .a{font-variant-numeric:tabular-nums;font-weight:600}


/* ---------- plan tab ---------- */
.hidenote{text-align:center;font-size:12.5px;color:var(--muted);padding:2px 0 6px}
.sugrow{flex:none;display:flex;gap:6px;padding:6px 12px 0;overflow-x:auto}
.sugrow:empty{display:none}
.sugrow button{flex:none;max-width:70%;min-height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);font:500 14px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugrow button small{color:var(--muted);margin-left:6px;font-size:12.5px}
.psec{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto}
.psec button{flex:1;min-height:40px;padding:0 8px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);color:var(--muted);font:600 13.5px var(--font);white-space:nowrap}
.psec button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.plrow{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;min-height:62px}
.plrow+.plrow{border-top:1px solid var(--line)}
.plrow .mid{flex:1;min-width:0}
.plrow .t1{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plrow .t2{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plrow .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mini{min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font:600 13.5px var(--font)}
.mini.ghost{background:none;color:var(--ink);border-color:var(--line)}
.photorow{flex:none;position:relative;padding:8px 12px 0;display:flex;gap:8px;align-items:stretch}
.photorow>#e-photo{flex:1 1 auto;min-width:0;width:auto}
.photorow>#e-photo span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.photorow>#e-photo small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photorow>#e-rep{flex:0 0 auto;width:auto;min-width:74px;max-width:34%;flex-direction:column;justify-content:center;gap:2px;padding:6px 8px;text-align:center;border-style:solid}
.photorow>#e-rep.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#e-rep .pi{font-size:20px}#e-rep span.rl{font:600 12.5px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.photorow button{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 14px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);text-align:left;font:600 15px var(--font);color:var(--ink)}
.photorow button small{display:block;font:400 12.5px var(--font);color:var(--muted)}
.photorow button img{width:42px;height:42px;object-fit:cover;border-radius:8px;flex:none}
.photorow .pi{font-size:24px;line-height:1}

/* ---------- budgets ---------- */
.bcard{position:relative;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.bcard .top{display:flex;gap:12px;align-items:flex-start}
.bcard .info{flex:1;min-width:0}
.bcard .name{font:600 18px var(--font)}
.bcard .ln{font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted)}
.bcard .ln b{font-weight:600;color:var(--ink)}
.bcard .side{text-align:right;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:600;font-size:14px;background:var(--income);color:#fff;font-variant-numeric:tabular-nums}
.pill.over{background:var(--expense)}
.btrack{height:14px;border-radius:7px;border:1.5px solid var(--accent);margin-top:10px;overflow:hidden}
.btrack>i{display:block;height:100%;background:var(--income);opacity:.8}
.btrack>i.over{background:var(--expense);opacity:.9}
.bover{text-align:right;color:var(--expense);font-size:13.5px;margin-top:4px}
.kebab{width:44px;height:44px;border:0;background:none;border-radius:22px;color:var(--muted);display:grid;place-items:center;flex:none}
.kebab:active{background:var(--soft)}
.kebab svg{width:22px;height:22px;fill:currentColor}

/* ---------- accounts / categories ---------- */
.acard{display:flex;align-items:center;gap:14px;margin:12px 14px 0;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.acard .mid{flex:1;min-width:0}
.acard .nm{font:600 18px var(--font)}
.acard .bal{font-size:16px;font-variant-numeric:tabular-nums;color:var(--muted)}
.acard .bal b{font-weight:600}
.crow{display:flex;align-items:center;gap:14px;padding:8px 6px 8px 14px;min-height:60px}
.crow .nm{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- layers ---------- */
#layers{position:relative;z-index:50}
.layer{position:fixed;left:0;right:0;top:var(--vvt);height:var(--vvh);z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;
  max-height:90%;overflow-y:auto;overscroll-behavior:contain;padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0;padding:4px 18px 10px;font:600 19px var(--font)}
.sheet .pad{padding:0 18px}
.sopt{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:6px 18px;border:0;background:none;text-align:left;font-size:16px}
.sopt:active{background:var(--soft)}
.sopt .sub{display:block;font-size:13px;color:var(--muted)}
.sopt .grow{flex:1;min-width:0}
.sopt .chk{color:var(--accent);font-weight:700}
.sopt.danger{color:var(--expense)}
.sopt .ico{width:40px;height:40px;font-size:19px}
.srow{display:flex;gap:10px;padding:14px 18px 0}
.srow .btn{flex:1}
.field{display:block;margin:12px 18px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.field textarea{padding:12px 14px;min-height:150px;resize:vertical;font:13px ui-monospace,Menlo,Consolas,monospace}
.err{min-height:20px;margin:8px 18px 0;color:var(--expense);font-size:13.5px}
.igrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:0 18px}
.igrid button{aspect-ratio:1;border:1.5px solid transparent;border-radius:10px;background:var(--soft);font-size:20px;display:grid;place-items:center;padding:0}
.igrid button.on{border-color:var(--accent);background:var(--bg)}
.cgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:0 18px}
.cgrid button{aspect-ratio:1;border:2px solid transparent;border-radius:50%;padding:0}
.cgrid button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.screen{position:absolute;inset:0;max-width:560px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;animation:slide .2s ease-out;
  padding-top:env(safe-area-inset-top,0px)}
.sbar{flex:none;display:flex;align-items:center;gap:4px;height:56px;padding:0 4px;background:var(--bar);border-bottom:1px solid var(--line)}
.sbar h2{flex:1;margin:0;font:600 20px var(--font)}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(84%,330px);background:var(--bar);color:var(--ink);padding-top:env(safe-area-inset-top,0px);animation:dr .2s ease-out;overflow-y:auto;box-shadow:8px 0 30px rgba(0,0,0,.3)}
.drawer .brand{padding:22px 20px 14px;border-bottom:1px solid var(--line)}
.drawer .brand b{display:block;font:700 26px var(--font);letter-spacing:-.02em}
.drawer .grp{padding:14px 20px 4px;color:var(--muted);font-size:14px}
.drawer .sopt{min-height:56px;padding:6px 20px}
.drawer .sopt svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.drawer hr{border:0;border-top:1px solid var(--line);margin:8px 0}

.pref{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 18px;border:0;background:none;text-align:left}
.pref:active{background:var(--soft)}
.pref .grow{flex:1;min-width:0}
.pref .t{font-size:17px;font-weight:500}
.pref .s{font-size:14px;color:var(--muted)}
.ph{padding:20px 18px 4px;color:var(--accent);font-weight:600;font-size:15px}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:var(--track);position:relative;flex:none;transition:background .15s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.note{padding:10px 18px;color:var(--muted);font-size:14px}
.kv{display:flex;justify-content:space-between;padding:10px 18px;font-size:15px}
.hlp{padding:6px 18px}
.hlp h4{margin:16px 0 4px;font:600 17px var(--font)}
.hlp p,.hlp li{margin:4px 0;color:var(--muted)}
.hlp ul{padding-left:20px;margin:4px 0}

/* ---------- record editor ---------- */
.editor{padding-bottom:env(safe-area-inset-bottom,0px)}
.etop{flex:none;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 6px}
.tbtn{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border:0;background:none;font-weight:700;letter-spacing:.02em;color:var(--accent);font-size:15px}
.tbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tbtn.del{color:var(--expense)}
.seg3{flex:none;display:flex;justify-content:center;align-items:center;padding:6px 8px 10px}
.seg3 button{border:0;background:none;min-height:46px;padding:0 16px;font-weight:600;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.seg3 button+button{border-left:1.5px solid var(--line)}
.seg3 button[aria-pressed="true"]{color:var(--ink)}
.seg3 button .ck{display:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);place-items:center;font-size:14px}
.seg3 button[aria-pressed="true"] .ck{display:grid}
.pickrow{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.pickrow .pl{text-align:center;color:var(--muted);font-size:14px;margin-bottom:6px}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;min-width:0}
.pick span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.empty{color:var(--muted)}
#e-note{flex:1;min-height:56px;margin:10px 12px 0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);resize:none;font-size:16px}
.amtbox{flex:none;display:flex;align-items:center;gap:6px;margin:10px 12px 0;padding:6px 10px 6px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-height:70px}
.amtbox .a{flex:1;text-align:right;font:500 40px/1.1 var(--font);font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.amtbox .a::-webkit-scrollbar{display:none}
.amtbox .cur{color:var(--muted);font-size:22px}
.keys{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px 0}
.keys button{min-height:56px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font:500 26px var(--font)}
.keys button.op{background:var(--soft);color:var(--accent)}
.keys button:active{background:var(--track)}
.dtrow{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 12px}
.dtrow input{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--surface);text-align:center;font-size:17px;font-weight:500;color:var(--ink);padding:0 6px;min-width:0}
.dtrow input::-webkit-calendar-picker-indicator{opacity:.5}
.dtrow .timebtn{min-height:50px;border:0;border-radius:10px;background:var(--surface);color:var(--ink);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.timebtn .tc{font-size:12px;font-weight:600;color:var(--accent);margin-left:2px}
.timebtn span{white-space:nowrap}
@media(max-width:359px){.timebtn .tc{display:none}.dtrow .timebtn{font-size:16px}}
.tpdisp{font:700 44px var(--font);text-align:center;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.tpchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 14px 8px}
.tpchips button,.tpstep button{min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:600}
.tplbl{margin:8px 18px 4px;color:var(--muted);font-size:13px;font-weight:600}
.tpgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 18px}
.tpgrid button{min-height:48px;border:1.5px solid transparent;border-radius:12px;background:var(--soft);color:var(--ink);font-size:17px;font-weight:600}
.tpgrid button.on,.tpap button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tpstep{display:flex;gap:8px;justify-content:center;margin:12px 14px 4px}
.tpap{margin:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:none}
.tpap button{min-height:48px;border:1.5px solid transparent;border-radius:12px;background:var(--soft);color:var(--ink);font-size:16px;font-weight:600}
.rthumb{width:42px;height:42px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line)}
.icustom{display:flex;gap:8px;margin:10px 18px 0}.icustom input{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font-size:16px}
.icustom .btn{flex:none;min-height:44px;padding:0 12px;font-size:14px}
.inote{margin:6px 18px 0;color:var(--muted);font-size:12.5px}
.liblist{max-height:52vh;overflow:auto;margin:0 10px}
.libit{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:4px 10px;border:1.5px solid transparent;border-radius:12px;background:none;color:var(--ink);text-align:left;font-size:15.5px}
.libit .nm{flex:1;min-width:0}.libit .ck{font-size:13px;color:var(--accent);font-weight:700;min-width:44px;text-align:right}
.libit.on{border-color:var(--accent);background:var(--accent-soft)}.libit.dis{opacity:.5}
@media (max-height:700px){.keys button{min-height:46px;font-size:23px}.amtbox{min-height:58px}.amtbox .a{font-size:34px}.pick{min-height:48px}}

.lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
.lock h2{margin:0;font:700 28px var(--font)}
.dots{display:flex;gap:14px;margin:8px 0 6px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:10px}
.pinpad button{height:68px;border-radius:34px;border:1.5px solid var(--line);background:var(--surface);font:500 28px var(--font)}
.pinpad button:active{background:var(--track)}
.pinpad button.plain{border-color:transparent;background:none;font-size:15px}
.shake{animation:shake .35s}
.perr{min-height:22px;color:var(--expense);font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:min(92vw,460px);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:400;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(24px);opacity:.2}to{transform:none;opacity:1}}
@keyframes dr{from{transform:translateX(-30px);opacity:.2}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){body{background:var(--bg)}#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* ---------- display options ---------- */
.og{display:flex;gap:6px;padding:8px 18px 4px;align-items:flex-start}
.og .lb{flex:none;width:108px;padding-top:11px;font-weight:600;font-size:16px;text-align:right}
.og .ol{flex:1;display:flex;flex-direction:column}
.og .ob{display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:none;text-align:left;font-weight:600;letter-spacing:.02em;color:var(--muted);font-size:15px;padding:0 4px}
.og .ob .tk{width:18px;color:var(--accent);font-weight:800}
.og .ob[aria-pressed="true"]{color:var(--ink)}
.og .ob:active{background:var(--soft)}
.kv.carry{margin:6px 14px 0;padding:10px 4px;border-bottom:1px solid var(--line)}

/* ---------- uniform look: matches the Goals / To-do pages of the host app ---------- */
html,body{background:var(--bg)}
body{font:15px/1.4 var(--font)}
#app{max-width:1180px;padding:0 14px;background:transparent;border:0!important}
@media (min-width:760px){#app{padding:0 22px}}
.hdr{background:transparent;border:0}
.appbar,#h-tabs{display:none}
.monthbar{height:auto;margin:6px 0 2px;gap:6px;justify-content:flex-start}
.monthbar .lbl{flex:1;min-width:0;text-align:center;font:650 16px var(--font)}
.monthbar .right{position:static;display:flex;gap:6px}
.monthbar .ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card,var(--surface));box-shadow:var(--shadow);flex:none}
.monthbar .ibtn .dot{top:6px;right:6px}
.searchrow{padding:6px 0 4px}
.strip{gap:8px;padding:0;margin:10px 0 4px}
.strip>div{display:flex;flex-direction:column-reverse;gap:1px;background:var(--surface);border-radius:14px;padding:10px 6px;box-shadow:var(--shadow)}
.strip .k{font-size:11px}
.strip .v{font:700 clamp(15px,4.6vw,19px)/1.25 var(--font)}
.stripwide{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);font:700 19px var(--font);margin:10px 0 0}
.chips{padding:8px 0 0}
main#view{padding:6px 0 96px}
.dayh,.sech{margin:20px 4px 8px;padding:0;border:0;font:600 13px var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cardgrp{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.cardgrp>.recw+.recw,.cardgrp>.rec+.rec,.cardgrp>.arow+.arow,.cardgrp>.crow+.crow,.cardgrp>.trow+.trow{border-top:1px solid var(--line)}
.rec,.recw,.arow,.crow,.trow{background-image:none!important}
.arow{border-top:0}
.rec .amt{font:700 16px var(--font)}
.arow .pct{width:76px;font:700 15px var(--font);white-space:nowrap}
.donutrow{border-bottom:1px solid var(--line)}
.kv.carry{padding:12px 14px}
.dd{width:100%;margin:12px 0 4px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font:600 14px var(--font);letter-spacing:0;color:var(--ink)}
.donutrow{padding:12px 10px}
.bar,.btrack{height:8px;border:0;border-radius:99px;background:var(--track)}
.bar>i{opacity:1;border-radius:99px}
.btrack>i{opacity:1;border-radius:99px}
.pill{border-radius:99px;font-size:12.5px;padding:2px 10px}
.bcard,.acard{background:var(--surface);border:0;border-radius:16px;box-shadow:var(--shadow);margin:0 0 10px;padding:14px}
.bcard .name,.acard .nm{font:650 16px var(--font)}
.crow .nm{font-size:16px}
.crow{min-height:56px}
.btn.wide{width:100%;margin:12px 0 0}
.btn.outline{border:1.5px dashed var(--line);color:var(--accent)}
.fab{right:16px;bottom:18px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#nudge{bottom:84px}
.empty{padding:36px 16px}
.hlp h4,.sheet h3,.sbar h2,.empty strong,.lock h2{font-family:var(--font)}

/* ---------- full-screen pages (Settings, Preferences, Backup, Help...) look like the app's own pages ---------- */
.screen{left:0;right:0;max-width:none;margin:0;background:var(--bg)}
.screen.editor{max-width:560px;margin:0 auto;box-shadow:0 0 0 100vmax var(--bg)}
.screen>.sbar,.screen>.sbody{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
.sbar{height:auto;padding:14px 14px 6px;gap:12px;background:transparent;border:0}
.sbar .ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);flex:none}
.sbar h2{font:700 22px var(--font);letter-spacing:-.3px}
.sbody{padding:4px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.screen .sopt,.pref{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin:0 14px 8px;width:calc(100% - 28px)}
.screen .sopt:active,.pref:active{background:var(--soft)}
.setlist .brand,.setlist hr,.sbody .hr{display:none}
.setlist .grp,.ph{padding:0;margin:22px 18px 8px;color:var(--muted);font:600 13px var(--font);text-transform:uppercase;letter-spacing:.08em}
.setlist .sopt{min-height:60px;padding:8px 16px}
.hlp{margin:0 14px;padding:10px 18px 16px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.sbody>.note{padding:6px 18px}
.sbody .kv{margin:0 14px;padding:12px 14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.sbody .btn.wide,.sbody>.srow{margin-left:14px;margin-right:14px}

/* ---------- polish pass: alignment and small-screen fixes ---------- */
.pick.empty{padding:0 10px;text-align:center}
.pickrow{align-items:start}
.strip .v{white-space:nowrap;overflow-wrap:normal;font-size:clamp(12px,3.5vw,17px)}
.stripwide{font-size:clamp(15px,4.6vw,19px);overflow-wrap:anywhere}
main#view{padding-bottom:110px}
#toast{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#nudge{bottom:88px}
.pref .grow>.t,.pref .grow>.s{display:block}
.sheet .pref{background:none;box-shadow:none;margin:0;width:100%;border-radius:0;padding:12px 18px}
.sheet .srow:last-child{position:sticky;bottom:0;background:var(--surface);padding:12px 18px 14px;margin-top:10px;border-top:1px solid var(--line)}
.sheet .field input[type=text],.sheet .field input[type=number],.sheet .field select{background:var(--bg)}
.sheet{scrollbar-width:thin}
main#view{scrollbar-width:thin}
.seg3.owe{display:flex;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);flex:none}
.seg3.owe button{padding:0 12px;min-height:48px;font-size:14px;letter-spacing:0;border-left:0!important;color:var(--muted)}
.seg3.owe button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sbody .btn.wide,.sbody>.btn{width:calc(100% - 28px);margin-left:14px;margin-right:14px}
.sbody>.btn{display:block;margin-top:10px}
.sbody .field{margin-left:14px;margin-right:14px}
.sbody .field select,.sbody .field input{max-width:100%}
.sbody .ph+.note{padding-left:18px;padding-right:18px}
.trow{grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:4px;padding:12px;font-size:13px;white-space:nowrap}
.trow.head{font-size:12px}
.trend svg{max-height:250px}
.trow span:not(:first-child){text-align:right}
.kebab{width:40px;height:40px}
.crow,.rec,.arow,.pref,.sopt,.stab,.keys button{-webkit-tap-highlight-color:transparent}
@media (max-width:420px){
  .pickrow{gap:8px}
  .bcard .side{font-size:12.5px}
  .acard,.bcard{padding:12px}
}
.sheet.foot{padding-bottom:0}
.sheet.foot .srow:last-child{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}

/* ---- long names / huge amounts must never overlap or get cut off ---- */
.strip .v{white-space:normal!important;overflow-wrap:anywhere!important;font-size:clamp(11px,3.3vw,17px)!important;line-height:1.2!important}
.kpi .v{white-space:normal;overflow-wrap:anywhere}
.rec .mid{flex:1 1 0;min-width:72px;overflow:hidden}
.rec .t2{overflow:hidden}
.rec .t2>span,.rec .t2 .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rec .amt{flex:0 1 auto;min-width:0;max-width:58%;white-space:normal;overflow-wrap:anywhere;text-align:right;font-size:clamp(12px,3.8vw,16px)}
.plrow .amt,.trow span{overflow-wrap:anywhere}
.arow,.crow,.trow,.plrow{min-width:0}

/* ---- editor: never hide the date/time row (suggestions, small screens, big text) ---- */
.editor{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.editor>*{flex-shrink:0}
.editor>#e-note{flex:1 1 56px;min-height:56px;max-height:120px}
.editor .dtrow{position:sticky;bottom:0;z-index:3;background:var(--bg);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.keys button{min-height:clamp(40px,6.2vh,56px)}
.amtbox{min-height:clamp(52px,8vh,70px)}
.etools{display:flex;align-items:center}
.sugrow{padding-top:6px}
.sugrow button{min-height:34px}

.crow.off{opacity:.62}
.offtag{margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:600;vertical-align:middle}
.bookbar{padding:8px 14px 0;display:flex}
.bookpill{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:600 13.5px var(--font)}
.bookpill .bn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bookpill .bc{color:var(--muted);font-size:11px}
.bookpill:active{background:var(--soft)}
/* ---- v8: swipe, select, undo toast, pins, filters, book look ---- */
.recw{display:block;position:relative;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rsl{display:flex;align-items:center;min-width:0;background:var(--surface);position:relative;z-index:1;transition:transform .16s ease}
.recw.swiping .rsl{transition:none}
.rsl>.rec{flex:1 1 auto;min-width:0;width:auto}
.swbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:700 13px var(--font);color:#fff}
.swbg span{display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .1s}
.swbg svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.recw.toR .swbg{background:var(--accent)}.recw.toR .swl{opacity:1}
.recw.toL .swbg{background:var(--expense,#D32F2F)}.recw.toL .swr{opacity:1}
.recw.armed .swbg span{transform:scale(1.06)}
.recw.sel .rsl{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.rck{flex:none;width:24px;height:24px;margin-left:14px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-accent);font-size:14px;font-weight:800;line-height:1}
.rck.on{background:var(--accent);border-color:var(--accent)}
.rck+.rec{padding-left:10px}
.selbar{display:flex;align-items:center;gap:6px;padding:8px 10px 0 6px}
.selbar .selct{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbar .ibtn{width:40px;height:40px;flex:none}
.selbar .sbtn{flex:none;min-height:38px;padding:0 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--font)}
.selbar .sbtn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tipc{margin:10px 14px 0;padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-size:13.5px;line-height:1.4;color:var(--ink)}
.tipc b{display:block;margin-bottom:2px}
.tipc button{margin-top:8px;min-height:36px;padding:0 16px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font:600 13.5px var(--font)}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;text-align:left}
#toast.act button{flex:none;border:0;background:none;color:var(--accent-on-ink,#8ab4ff);font-weight:700;font-size:14.5px;text-transform:none;min-height:32px;padding:0 4px}
.frow2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:0 18px}
.frow2>.field{min-width:0}.frow2 input{min-width:0;width:100%;box-sizing:border-box}
.sheet .note,.sheet h3{overflow-wrap:anywhere}
.frow2 .field{padding:0;margin:8px 0}
.pinmark{font-size:12px;margin-left:6px}
.bookbar{align-items:center;gap:8px}
.bookpill{flex:0 1 auto;max-width:calc(100% - 48px)}
.bookbar.hasnx .bookpill{max-width:44%}
.bookpill .bi{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:13px;flex:none}
.nxchip{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:500 12.5px var(--font)}
.nxchip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nxchip.due{border-color:var(--expense,#D32F2F);color:var(--expense,#D32F2F);font-weight:700}
.eyebtn{flex:none;margin-left:auto;width:38px;height:34px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);display:grid;place-items:center}
.eyebtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.eyebtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plrow .rnote{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink);opacity:.8;overflow-wrap:anywhere}
.lookrow{display:flex;flex-wrap:wrap;gap:6px 8px;padding:0 16px 8px}
.lookrow button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;background:var(--soft);font-size:19px;display:grid;place-items:center}
.lookrow button[aria-pressed="true"]{border-color:var(--ink)}
.lookrow.cols button{border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--surface)}
.lbl2{padding:0 16px 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.ovr{padding:10px 16px;border-top:1px solid var(--line)}
.ovr:first-of-type{border-top:0}
.ovr .h{display:flex;align-items:center;gap:10px;font-weight:700}
.ovr .h .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovr .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.ovr .g b{display:block;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
@media(max-width:380px){.nxchip{font-size:12px;padding:0 8px}.bookpill{max-width:44%}}

.bkin{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px var(--font);box-sizing:border-box}

@media (min-width:900px) and (min-height:560px){

  .keys button{min-height:clamp(40px,5.4vh,54px)}
}

/* ---------- money ---------- */
function groupInt(s){
  if(D.settings.grouping==='indian'){
    if(s.length<=3)return s;
    return s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+s.slice(-3);
  }
  return s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function numStr(cents){
  var dec=D.settings.decimals,v=(Math.abs(cents)/100).toFixed(dec),p=v.split('.');
  return groupInt(p[0])+(p[1]?'.'+p[1]:'');
}
function shortNum(cents){
  var v=Math.abs(cents)/100,ind=D.settings.grouping==='indian',u=ind?[[1e7,' Cr'],[1e5,' L']]:[[1e9,' B'],[1e6,' M'],[1e4,' K']],i;
  for(i=0;i<u.length;i++)if(v>=u[i][0])return String(+(v/u[i][0]).toFixed(2))+u[i][1];
  return null;
}
function money(cents,plus){
  if(D.settings.hide&&!S.reveal)return (cents<0?'\u2212':'')+D.settings.currency+'\u2022\u2022\u2022\u2022';
  var s=D.settings.compact?(shortNum(cents)||numStr(cents)):numStr(cents),c=D.settings.currency,body=D.settings.position==='end'?s+' '+c:c+s;
  return (cents<0?'\u2212':(plus&&cents>0?'+':''))+body;
}
function toCents(str){
  var t=String(str==null?'':str).replace(/\u2212/g,'-').replace(/[a-z]+\.?/gi,'').replace(/\s/g,'').replace(/[^\d.,\-()]/g,'');
  if(!t)return NaN;
  var neg=false;
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}
  if(t.charAt(0)==='-'){neg=!neg;t=t.slice(1);}
  var lc=t.lastIndexOf(','),ld=t.lastIndexOf('.');
  if(lc>=0&&ld>=0){t=lc>ld?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');}            /* both: the last one is the decimal mark */
  else if(lc>=0){var after=t.length-lc-1,cnt=(t.match(/,/g)||[]).length;t=(cnt===1&&after>0&&after<=2)?t.replace(',','.'):t.replace(/,/g,'');}   /* 900,50 is a decimal; 1,250 and 12,34,567 are thousands */
  else if(ld>=0&&(t.match(/\./g)||[]).length>1)t=t.replace(/\./g,'');                              /* 1.250.000 */
  if(!/^\d*\.?\d*$/.test(t)||t==='.'||t==='')return NaN;
  var v=Math.round(parseFloat(t)*100);
  return neg?-v:v;
}
function centsToPlain(c){
  var s=(c/100).toFixed(2);
  return s.indexOf('.')>=0?s.replace(/0+$/,'').replace(/\.$/,''):s;
}

}

/* ---------- view mode: day / week / month / 3 / 6 months / year ---------- */
var VIEWS_MODES=[['day','Daily'],['week','Weekly'],['month','Monthly'],['3m','3 months'],['6m','6 months'],['year','Yearly']];
function viewMode(){var v=D.settings.view;return VIEWS_MODES.some(function(x){return x[0]===v;})?v:'month';}
function isoOf(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function periodRange(){
  var v=viewMode(),a=S.anchor.split('-').map(Number),y=a[0],m=a[1]-1,d=a[2];
  if(v==='day'){
    var dd=new Date(y,m,d);
    return {from:S.anchor,to:S.anchor,label:DAYS_LONG[dd.getDay()].slice(0,3)+', '+d+' '+MONTHS[m]+' '+y};
  }
  if(v==='week'){
    var dt=new Date(y,m,d),dow=(dt.getDay()+6)%7,s=new Date(y,m,d-dow),e=new Date(y,m,d-dow+6);
    return {from:isoOf(s),to:isoOf(e),label:s.getDate()+(s.getMonth()!==e.getMonth()?' '+MONTHS[s.getMonth()]:'')+' – '+e.getDate()+' '+MONTHS[e.getMonth()]+' '+e.getFullYear()};
  }
  if(v==='year')return {from:y+'-01-01',to:y+'-12-31',label:String(y)};
  var n=v==='month'?1:v==='3m'?3:6,start=new Date(y,m-(n-1),1),end=new Date(y,m+1,0);
  var label=n===1?MONTHS_LONG[m]+' '+y:MONTHS[start.getMonth()]+(start.getFullYear()!==y?' '+start.getFullYear():'')+' – '+MONTHS[m]+' '+y;
  return {from:isoOf(start),to:isoOf(end),label:label};
}
function periodRecs(){var r=periodRange();return D.records.filter(function(x){return x.d>=r.from&&x.d<=r.to;});}
function shiftAnchor(sign){
  var v=viewMode(),a=S.anchor.split('-').map(Number),d;
  if(v==='day')d=new Date(a[0],a[1]-1,a[2]+sign);
  else if(v==='week')d=new Date(a[0],a[1]-1,a[2]+7*sign);
  else{
    var step={month:1,'3m':3,'6m':6,year:12}[v],tm=a[1]-1+step*sign,dim=new Date(a[0],tm+1,0).getDate();
    d=new Date(a[0],tm,Math.min(a[2],dim));
  }
  S.anchor=isoOf(d);
}
/* Carry over: everything earned minus spent before the period starts (respecting active filters). */
function carryAmount(){
  if(!D.settings.carry)return 0;
  var from=periodRange().from;
  return sums(applyFilter(D.records.filter(function(r){return r.d<from;}))).net;

/* ---------- analysis ---------- */
var ANALYSIS=[{v:'ins',l:'Insights'},{v:'exp',l:'Expense overview'},{v:'inc',l:'Income overview'},{v:'acc',l:'Spending by account'},{v:'trend',l:'Monthly trend'},{v:'nw',l:'Net worth'},{v:'yr',l:'Yearly report'}];
function groupTotals(list,mode){
  var map={},tot=0;
  list.forEach(function(r){
    if((mode==='exp'||mode==='acc')&&r.t!=='e')return;
    if(mode==='inc'&&r.t!=='i')return;

  });

    var o=mode==='acc'?IDX.acc[k]:IDX.cat[k];
    return {id:k,name:o?o.name:'Uncategorized',icon:o?o.icon:'❔',color:o?o.color:'#9E9E9E',v:map[k]};
  }).sort(function(a,b){return b.v-a.v;});
  return {rows:rows,total:tot};
}
function donut(rows,total,label){
  var top=rows.slice(0,9),rest=rows.slice(9),R=70,C=2*Math.PI*R,off=0,segs='';
  if(rest.length){var sum=0;rest.forEach(function(x){sum+=x.v;});top.push({name:'Others',color:'#9E9E9E',v:sum});}
  top.forEach(function(r){
    var len=r.v/total*C;
    segs+='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+esc(r.color)+'" stroke-width="42" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 100 100)"/>';
    off+=len;
  });
  var legend='<div class="legend">'+top.map(function(r){return '<div><i style="background:'+esc(r.color)+'"></i><span>'+esc(r.name)+'</span></div>';}).join('')+'</div>';
  return '<div class="donutrow"><svg viewBox="0 0 200 200" role="img" aria-label="'+esc(label)+' chart">'+segs+'<text x="100" y="106" text-anchor="middle" fill="var(--ink)" font-size="17" >'+esc(label)+'</text></svg>'+legend+'</div>';
}
function trendData(m){

/* ---------- insights ---------- */
function addDays(iso,n){var p=iso.split('-').map(Number);return isoOf(new Date(p[0],p[1]-1,p[2]+n));}

function pctChange(cur,prev){if(!prev)return null;return (cur-prev)/prev*100;}
function deltaTxt(cur,prev,goodWhenDown){

  var up=p>0,good=goodWhenDown?!up:up,col=Math.abs(p)<0.5?'var(--muted)':(good?'var(--income)':'var(--expense)');

}

    '<div class="kpi"><div class="k">Income</div><div class="v inc">'+esc(money(cs.inc))+'</div><div class="d">'+deltaTxt(cs.inc,ps.inc,false)+'</div></div>'+

    '<div class="kpi"><div class="k">Savings rate</div><div class="v '+(rate!==null&&rate<0?'exp':'')+'">'+(rate===null?'–':rate+'%')+'</div><div class="d">'+(rate===null?'no income recorded':rate>=20?'healthy (20%+ is a good target)':rate>=0?'try to reach 20%':'spending more than earning')+'</div></div></div>';

/* =====================================================================
   Plan tab: recurring entries, savings goals, loans & cards
   Net worth, yearly report, saved views, receipt photos
   ===================================================================== */
function addMonths(iso,n,day){
  var p=iso.split('-').map(Number),t=new Date(p[0],p[1]-1+n,1),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return isoOf(new Date(t.getFullYear(),t.getMonth(),Math.min(day||p[2],dim)));
}
function monthsBetween(a,b){var p=a.split('-').map(Number),q=b.split('-').map(Number);return (q[0]-p[0])*12+(q[1]-p[1]);}
function advanceDue(r,iso){
  if(r.freq==='weekly')return addDays(iso,7);
  if(r.freq==='yearly')return addMonths(iso,12,r.day);
  return addMonths(iso,1,r.day);
}
var FREQ={monthly:'Every month',weekly:'Every week',yearly:'Every year'};
function ruleOk(r){return !!(r&&IDX.cat[r.c]&&IDX.acc[r.ac]&&isoOk(r.next)&&r.a>0);}
function ruleActive(r,d){return r.on!==false&&(!r.end||d<=r.end);}
function postOcc(r,date,amt){
  if(amt>0)r.a=amt;
  D.records.push({id:uid(),t:IDX.cat[r.c].type==='income'?'i':'e',a:r.a,ac:r.ac,to:'',c:r.c,n:r.note||r.name,d:date,tm:'00:00',cr:Date.now(),rc:r.id});
  r.next=advanceDue(r,date);
  if(r.end&&r.next>r.end)r.on=false;
}
function skipOcc(r){r.next=advanceDue(r,r.next);if(r.end&&r.next>r.end)r.on=false;}
/* Posts every due occurrence of rules set to "add automatically". Returns how many were added. */
function processRecurring(){
  var t=todayISO(),n=0;
  D.recurring.forEach(function(r){
    if(!r.auto||r.ask||!ruleOk(r)||IDX.cat[r.c].off)return;
    var guard=0;
    while(r.on!==false&&r.next<=t&&ruleActive(r,r.next)&&guard++<60){postOcc(r,r.next);n++;}
  });
  if(n)save();
  return n;
}
function dueList(){
  var t=todayISO(),out=[];
  D.recurring.forEach(function(r){
    if(r.auto||!ruleOk(r)||r.on===false||IDX.cat[r.c].off)return;
    var d=r.next,g=0;
    while(d<=t&&ruleActive(r,d)&&g++<24){out.push({r:r,d:d});d=advanceDue(r,d);}
  });
  return out.sort(function(a,b){return a.d<b.d?-1:1;});
}
/* Occurrences from tomorrow-or-pending up to `to` without changing anything (for forecasts and the upcoming list). */
function upcomingOcc(to,fromExclusive){
  var out=[];
  D.recurring.forEach(function(r){
    if(!ruleOk(r)||r.on===false)return;
    var d=r.next,g=0;
    while(d<=to&&g++<60){
      if(ruleActive(r,d)&&(!fromExclusive||d>fromExclusive))out.push({r:r,d:d});
      d=advanceDue(r,d);if(r.end&&d>r.end)break;
    }
  });
  return out.sort(function(a,b){return a.d<b.d?-1:1;});
}

/* ---------- loans ---------- */
function emiCalc(P,rate,n){var r=rate/1200;if(!n)return P;return r?Math.round(P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)):Math.round(P/n);}
function loanCalc(l,asOf){
  var emi=l.emi||emiCalc(l.p,l.rate,l.n),r=l.rate/1200,bal=l.p,paid=0,day=+l.start.slice(8);
  var pre=(l.pre||[]).slice().sort(function(a,b){return a.d<b.d?-1:1;}),pi=0;
  if(asOf<l.start)return {bal:0,emi:emi,paid:0,left:0,payoff:'',interestLeft:0,never:false,started:false};
  while(paid<l.n&&addMonths(l.start,paid+1,day)<=asOf){
    var pd=addMonths(l.start,paid+1,day);
    while(pi<pre.length&&pre[pi].d<=pd){bal=Math.max(0,bal-pre[pi].a);pi++;}
    bal=bal+Math.round(bal*r)-emi;if(bal<0)bal=0;paid++;
  }
  while(pi<pre.length&&pre[pi].d<=asOf){bal=Math.max(0,bal-pre[pi].a);pi++;}
  var b2=bal,k=0,intr=0,never=false;
  while(b2>0&&k<600){var i=Math.round(b2*r);if(emi<=i){never=true;break;}intr+=i;b2=b2+i-emi;k++;}
  if(k>=600)never=true;
  return {bal:bal,emi:emi,paid:paid,left:k,payoff:(bal>0&&!never)?addMonths(l.start,paid+k,day):'',interestLeft:intr,never:never,started:true};
}
function loansOutstanding(asOf){var s=0;D.loans.forEach(function(l){if(l.kind==='loan')s+=loanCalc(l,asOf).bal;});return s;}

/* ---------- net worth ---------- */
function balancesAt(d){
  var b={};D.accounts.forEach(function(a){b[a.id]=a.open||0;});
  function add(id,v){if(id in b)b[id]+=v;}
  D.records.forEach(function(r){if(r.d>d)return;if(r.t==='i')add(r.ac,r.a);else if(r.t==='e')add(r.ac,-r.a);else{add(r.ac,-r.a);add(r.to,r.a);}});
  var s=0;for(var k in b)s+=b[k];return s;
}
function nwSeries(n){
  var out=[],t=todayISO(),m=t.slice(0,7);
  for(var i=n-1;i>=0;i--){
    var mm=shiftMonth(m,-i),d=i===0?t:addDays(addMonths(mm+'-01',1),-1);
    var as=balancesAt(d),li=loansOutstanding(d);
    out.push({m:mm,d:d,assets:as,debt:li,nw:as-li});
  }
  return out;
}

    data.map(function(d,i){return (i%2===(data.length-1)%2)?'<text x="'+pts[i][0].toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+MONTHS[+d.m.slice(5)-1]+'</text>':'';}).join('')+'</svg>';
  var h='<div class="kpis"><div class="kpi" style="grid-column:1/3"><div class="k">Net worth today</div><div class="v '+(cur.nw<0?'exp':'inc')+'" style="font-size:24px">'+esc(money(cur.nw))+'</div><div class="d"><span style="color:'+(ch>=0?'var(--income)':'var(--expense)')+'">'+(ch>=0?'▲ ':'▼ ')+esc(money(Math.abs(ch)))+'</span> over the last 11 months</div></div>'+
    '<div class="kpi"><div class="k">All accounts</div><div class="v">'+esc(money(cur.assets))+'</div></div><div class="kpi"><div class="k">Loans outstanding</div><div class="v '+(cur.debt?'exp':'')+'">'+esc(money(cur.debt))+'</div></div></div>';
  h+='<div class="cardgrp" style="margin-top:12px"><div class="ibox"><div class="sub">Accounts minus loans, at the end of each month</div>'+svg+'</div></div>';

    data.slice().reverse().map(function(d){return '<div class="trow"><span><b>'+esc(monthShort(d.m))+'</b></span><span>'+esc(money(d.assets))+'</span><span class="'+(d.debt?'exp':'')+'">'+esc(money(d.debt))+'</span><span class="'+(d.nw<0?'exp':'inc')+'">'+esc(money(d.nw))+'</span></div>';}).join('')+'</div>';
  if(!D.loans.length)h+='<p class="note">Tip: add your loans in the Plan tab and they are subtracted here automatically.</p>';

/* ---------- yearly report ---------- */
function vYear(){
  if(!S.ry)S.ry=+S.anchor.slice(0,4);
  var y=S.ry,rows=[],tot={inc:0,exp:0};
  for(var m=1;m<=12;m++){var k=y+'-'+pad(m),s=sums(monthRecs(k));rows.push({m:k,inc:s.inc,exp:s.exp,net:s.inc-s.exp});tot.inc+=s.inc;tot.exp+=s.exp;}
  var nav='<div class="monthbar" style="margin:8px 14px 0"><button class="ibtn" data-act="ryStep" data-d="-1" aria-label="Previous year">'+SVG.prev+'</button><span class="lbl" style="flex:1;text-align:center;font-weight:600">'+y+'</span><button class="ibtn" data-act="ryStep" data-d="1" aria-label="Next year">'+SVG.next+'</button></div>';

/* ---------- forecast (shown in Insights) ---------- */
function forecastBox(pr,cur,cs,elapsed,days){
  var t=todayISO(),up=upcomingOcc(pr.to),exps=cur.filter(function(r){return r.t==='e';});
  var varSoFar=0;exps.forEach(function(r){if(!r.rc)varSoFar+=r.a;});
  var remain=Math.max(0,days-elapsed),rate=elapsed>0?varSoFar/elapsed:0,variable=Math.round(rate*remain),cE=0,cI=0;
  var pend=up.filter(function(o){return o.d>=pr.from;});
  pend.forEach(function(o){if(IDX.cat[o.r.c]&&IDX.cat[o.r.c].type==='income')cI+=o.r.a;else cE+=o.r.a;});
  var fe=cs.exp+cE+variable,fi=cs.inc+cI,fn=fi-fe;
  var list=pend.slice(0,5).map(function(o){var c=IDX.cat[o.r.c];return '<div class="hrow"><span class="n" style="width:62px">'+esc(dayHead(o.d).split(',')[0])+'</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.r.name)+(o.d<=t?' <span class="mut">(due)</span>':'')+'</span><span class="a '+(c&&c.type==='income'?'inc':'exp')+'">'+esc(money(o.r.a))+'</span></div>';}).join('');
  return '<div class="sech">Forecast to '+esc(dayHead(pr.to).split(',')[0])+'</div><div class="cardgrp"><div class="ibox">'+
    '<div class="kv" style="padding:0 0 4px"><span>Spent so far</span><b class="exp">'+esc(money(cs.exp))+'</b></div>'+
    '<div class="kv" style="padding:0 0 4px"><span>Bills &amp; repeats still to come</span><b class="exp">'+esc(money(cE))+'</b></div>'+
    '<div class="kv" style="padding:0 0 4px"><span>Everyday spending expected ('+remain+' days)</span><b class="exp">'+esc(money(variable))+'</b></div>'+
    '<div class="kv" style="padding:6px 0 4px;border-top:1px solid var(--line)"><span><b>Expected total spend</b></span><b class="exp">'+esc(money(fe))+'</b></div>'+
    (fi?'<div class="kv" style="padding:0 0 4px"><span>Expected income</span><b class="inc">'+esc(money(fi))+'</b></div><div class="kv" style="padding:0"><span><b>Expected to save</b></span><b class="'+(fn<0?'exp':'inc')+'">'+esc(money(fn))+'</b></div>':'')+
    (list?'<div class="sub" style="margin:10px 0 4px">Coming up</div>'+list:'<div class="sub" style="margin-top:8px">No repeating items due. Add rent, EMIs or subscriptions in the Plan tab for a sharper forecast.</div>')+
    '</div></div>';
}

function withD(d,fn){var sD=D;D=d;try{return fn();}finally{D=sD;}}
function bookStats(b){
  var d=null;
  if(b.id===BK.active)d=D;else{try{d=sanitize(JSON.parse(localStorage.getItem(b.key)));}catch(e){d=null;}}
  if(!d)return null;
  var acc={},mo=todayISO().slice(0,7),inc=0,exp=0,bal=0;
  d.accounts.forEach(function(a){acc[a.id]=a.open||0;});
  d.records.forEach(function(r){
    function add(id,v){if(id in acc)acc[id]+=v;}
    if(r.t==='i')add(r.ac,r.a);else if(r.t==='e')add(r.ac,-r.a);else{add(r.ac,-r.a);add(r.to,r.a);}
    if(r.d.indexOf(mo)===0){if(r.t==='i')inc+=r.a;else if(r.t==='e')exp+=r.a;}
  });
  Object.keys(acc).forEach(function(k){bal+=acc[k];});
  return {d:d,bal:bal,inc:inc,exp:exp,n:d.records.length,cur:d.settings.currency,dec:d.settings.decimals,pos:d.settings.position};
}

/* ---------- suggestions from past notes ---------- */
var SUG=[];
function suggestFor(q){
  q=q.trim().toLowerCase();if(q.length<2||!E)return [];
  var m={};
  D.records.forEach(function(r){
    if(!r.n||r.t!==E.t)return;
    var k=r.n.trim().toLowerCase();if(k.indexOf(q)<0)return;
    var e=m[k]||(m[k]={n:r.n.trim(),cnt:0,last:r});e.cnt++;if(recSort(r,e.last)<0)e.last=r;
  });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.cnt-a.cnt||recSort(a.last,b.last);}).slice(0,3);
}
function renderSuggest(){
  var box=$('#e-sug');if(!box||!E)return;
  SUG=suggestFor($('#e-note').value);

/* ---------- receipt photos ---------- */
function compressImage(file,cb2){
  var fr=new FileReader();
  fr.onerror=function(){cb2(null);};
  fr.onload=function(){
    var im=new Image();
    im.onerror=function(){cb2(null);};
    im.onload=function(){
      try{
        var M=720,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
        var cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);
        cb2(c.toDataURL('image/jpeg',0.6));
      }catch(e){cb2(null);}
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function sgSaved(g){var s=0;(g.contrib||[]).forEach(function(c){s+=c.a;});return s;}
function sgInfo(g){
  var saved=sgSaved(g),left=Math.max(0,g.target-saved),t=todayISO(),out={saved:saved,left:left,pct:g.target>0?Math.min(100,Math.max(0,Math.round(saved/g.target*100))):0};
  if(left<=0){out.msg='🎉 Goal reached';return out;}
  if(g.due){
    var m=monthsBetween(t,g.due)+(g.due.slice(8)>=t.slice(8)?0:-1);
    if(g.due<t)out.msg='Past the target date · '+money(left)+' to go';
    else{m=Math.max(1,m);out.need=Math.ceil(left/m);out.msg='Save about '+money(out.need)+' a month to finish by '+monthShort(g.due.slice(0,7));}
  }
  var cs=(g.contrib||[]).filter(function(c){return c.a>0;}).sort(function(a,b){return a.d<b.d?-1:1;});
  if(cs.length>=2){
    var span=Math.max(1,monthsBetween(cs[0].d.slice(0,7)+'-01',t.slice(0,7)+'-01')+1),rate=saved/span;
    if(rate>0)out.eta='At your pace: '+monthShort(addMonths(t,Math.ceil(left/rate)).slice(0,7));

}

    var u=c.limit>0?Math.round((c.used||0)/c.limit*100):0,col=u>=60?'var(--expense)':u>=30?'#F9A825':'var(--income)',due='';
    if(c.dueDay){var dd=addMonths(t.slice(0,7)+'-01',0,c.dueDay);if(dd<t)dd=addMonths(t.slice(0,7)+'-01',1,c.dueDay);var dl=daysBetween(t,dd)-1;due='Payment due '+esc(dayHead(dd).split(',')[0])+(dl<=5?' <b class="exp">('+(dl===0?'today':'in '+dl+' day'+(dl===1?'':'s'))+')</b>':'');}

ACT.loanSave=function(el){
  var l=topLayer(),kind=el.dataset.k,name=$('#ln-name',l).value.trim(),cur=el.dataset.id?D.loans.filter(function(x){return x.id===el.dataset.id;})[0]:null;
  if(!name){formErr('Give it a name.');return;}
  var o;
  if(kind==='card'){
    var lim=toCents($('#ln-limit',l).value),used=toCents($('#ln-used',l).value),dd=parseInt($('#ln-due',l).value,10);
    if(isNaN(lim)||!(lim>0)){formErr('Enter the credit limit.');return;}
    if(isNaN(used)||used<0){formErr('Amount owed must be 0 or more.');return;}
    if($('#ln-due',l).value&&(isNaN(dd)||dd<1||dd>31)){formErr('Due day must be between 1 and 31.');return;}
    o={name:name,limit:lim,used:used,dueDay:isNaN(dd)?0:dd};
  }else{
    var p=toCents($('#ln-p',l).value),rate=parseFloat(String($('#ln-rate',l).value).replace(',','.')),n=parseInt($('#ln-n',l).value,10),st=$('#ln-start',l).value,emiRaw=$('#ln-emi',l).value.trim(),emi=emiRaw?toCents(emiRaw):0;
    if(isNaN(p)||!(p>0)){formErr('Enter the amount borrowed.');return;}
    if(isNaN(rate)||rate<0||rate>100){formErr('Interest rate must be between 0 and 100.');return;}
    if(isNaN(n)||n<1||n>600){formErr('Length must be 1 to 600 months.');return;}
    if(!isoOk(st)){formErr('Choose the start date.');return;}
    if(emiRaw&&(isNaN(emi)||!(emi>0))){formErr('EMI must be a number above 0.');return;}
    o={name:name,p:p,rate:rate,n:n,start:st,emi:emi||emiCalc(p,rate,n),emiSet:!!emiRaw};
  }
  if(!cur){cur={id:uid(),kind:kind,pre:[],icon:kind==='card'?'💳':'🏦'};D.loans.push(cur);}
  Object.assign(cur,o);
  if(kind==='loan'&&!el.dataset.id&&$('#ln-rc',l)&&$('#ln-rc',l).checked&&D.accounts.length){
    var cat=D.categories.filter(function(c){return c.type==='expense'&&/debt|loan|emi/i.test(c.name);})[0]||D.categories.filter(function(c){return c.type==='expense';})[0];
    if(cat){
      var c2=loanCalc(cur,todayISO()),nx=addMonths(cur.start,c2.paid+1,+cur.start.slice(8));
      D.recurring.push({id:uid(),on:true,name:name+' EMI',a:cur.emi,c:cat.id,ac:lastAccount(),freq:'monthly',next:nx,day:+nx.slice(8),end:'',auto:false});
    }
  }
  save();closeTop();render(true);toast('Saved');
};

function readFilterInputs(l){
  var f=S.filter,a=$('#f-acc',l),c=$('#f-cat',l);
  if(a)f.account=a.value;if(c)f.category=c.value;
  var err='';
  function amt(id){var e=$(id,l);if(!e)return undefined;var t=(e.value||'').trim();if(!t)return null;var v=toCents(t);if(isNaN(v)||v<0){err='Enter amounts as plain numbers.';return undefined;}return v;}
  var mn=amt('#f-amin'),mx=amt('#f-amax');
  if(!err){if(mn!==undefined)f.amin=mn;if(mx!==undefined)f.amax=mx;if(f.amin!=null&&f.amax!=null&&f.amin>f.amax){var t=f.amin;f.amin=f.amax;f.amax=t;}}
  var df=$('#f-dfrom',l),dt=$('#f-dto',l);
  if(df)f.dfrom=isoOk(df.value)?df.value:'';if(dt)f.dto=isoOk(dt.value)?dt.value:'';
  if(f.dfrom&&f.dto&&f.dfrom>f.dto){var t2=f.dfrom;f.dfrom=f.dto;f.dto=t2;}
  return err;
}

/* calculator */
function evalExpr(e){
  var toks=e.match(/\d+\.?\d*|[+\-×÷]/g)||[];
  if(toks[0]==='-'&&toks.length>1)toks.splice(0,2,String(-parseFloat(toks[1])));
  if(toks.length&&/^[+\-×÷]$/.test(toks[toks.length-1]))toks.pop();
  if(!toks.length)return 0;
  var nums=[],ops=[],i;
  toks.forEach(function(t,ix){if(ix%2===0)nums.push(parseFloat(t));else ops.push(t);});
  var n2=[nums[0]],o2=[];
  for(i=0;i<ops.length;i++){
    var b=nums[i+1];
    if(ops[i]==='×')n2[n2.length-1]*=b;
    else if(ops[i]==='÷'){if(b===0)return null;n2[n2.length-1]/=b;}
    else{o2.push(ops[i]);n2.push(b);}
  }
  var v=n2[0];
  for(i=0;i<o2.length;i++)v=o2[i]==='+'?v+n2[i+1]:v-n2[i+1];
  return v;
}
function keyPress(k){
  var e=E.expr,tok=(e.match(/[0-9.]*$/)||[''])[0];
  if(/^[0-9]$/.test(k)){
    if(tok.replace('.','').length>=12)return;
    if(tok.indexOf('.')>=0&&tok.split('.')[1].length>=2)return;
    e=tok==='0'?e.slice(0,-1)+k:e+k;
  }else if(k==='.'){
    if(tok.indexOf('.')>=0)return;
    e+=tok===''?'0.':'.';
  }else if(/^[+\-×÷]$/.test(k)){
    if(e==='0'&&k==='-')e='-';
    else if(/[+\-×÷]$/.test(e))e=e.slice(0,-1)+k;
    else e+=k;
  }else if(k==='='){
    var v=evalExpr(e);
    if(v===null){toast('Can’t divide by zero');return;}
    e=centsToPlain(Math.round(v*100));
  }else if(k==='back'){
    e=e.length>1?e.slice(0,-1):'0';
    if(e==='-')e='0';
  }
  E.expr=e;
}

ACT.saveRec=function(){
  E.n=$('#e-note').value.trim();E.d=$('#e-date').value;E.tm=$('#e-time').value||'00:00';
  var v=evalExpr(E.expr);
  if(v===null){toast('Can’t divide by zero');return;}

  if(!(cents>0)){toast('Enter an amount above 0');return;}
  if(!isoOk(E.d)){toast('Choose a date');return;}
  if(!E.ac||!IDX.acc[E.ac]){toast('Choose an account');return;}
  if(E.t==='x'){
    if(!E.to||!IDX.acc[E.to]){toast('Choose the account to transfer to');return;}
    if(E.to===E.ac){toast('Pick two different accounts');return;}
  }else if(!E.c||!IDX.cat[E.c]){toast('Choose a category');return;}
  if(E.t!=='x'&&IDX.cat[E.c].off){
    var was=E.id?D.records.filter(function(r){return r.id===E.id;})[0]:null;
    if(!was||was.c!==E.c){toast('\u201c'+IDX.cat[E.c].name+'\u201d is inactive. Pick another category, or make it active in Categories.');return;}
  }
  var rec={id:E.id||uid(),t:E.t,a:cents,ac:E.ac,to:E.t==='x'?E.to:'',c:E.t==='x'?'':E.c,n:E.n,d:E.d,tm:E.tm,cr:E.cr||Date.now()};
  if(E.ph)rec.ph=E.ph;if(E.rc)rec.rc=E.rc;
  if(E.id)D.records=D.records.map(function(r){return r.id===E.id?rec:r;});else D.records.push(rec);
  D.meta.lastAccount=E.ac;
  var repMsg='';
  if(E.rep&&E.t!=='x'&&FREQ[E.rep]){
    var rnm=(E.n||'').split('\n')[0].trim().slice(0,40)||IDX.cat[E.c].name,dup=D.recurring.filter(function(x){return x.freq===E.rep&&x.c===E.c&&x.ac===E.ac&&x.a===cents&&x.name===rnm;})[0];
    if(dup){repMsg=' \u00b7 already repeating';rec.rc=dup.id;}
    else{
      var rule={id:uid(),on:true,name:rnm,a:cents,c:E.c,ac:E.ac,freq:E.rep,next:'',day:+E.d.slice(8),end:'',auto:false};if(E.n)rule.note=E.n.slice(0,120);
      rule.next=advanceDue(rule,E.d);rule.day=+E.d.slice(8);
      D.recurring.push(rule);rec.rc=rule.id;repMsg=' \u00b7 repeats '+FREQ[E.rep].toLowerCase()+', next '+dayHead(rule.next).split(',')[0];
    }
  }
  var wasEdit=!!E.id,pr=periodRange(),moved=E.d<pr.from||E.d>pr.to;
  if(moved)S.anchor=E.d;
  save();closeTop();render(true);
  toast((moved?'Saved to '+periodRange().label:(wasEdit?'Record updated':'Record saved'))+repMsg);
};

  if(!n&&!rr){toast('No records use “'+c.name+'”');return;}

  if(!opts.length){toast('Add another '+c.type+' category first');return;}
  choiceSheet('Move '+n+' record'+(n===1?'':'s')+' from “'+c.name+'” to…',opts,'',function(to){

      D.records.forEach(function(r){if(r.c===c.id)r.c=t.id;});(D.recurring||[]).forEach(function(r){if(r.c===c.id)r.c=t.id;});

    });
  });

function moveAccountRecords(a){
  var n=D.records.filter(function(r){return r.ac===a.id||r.to===a.id;}).length;
  if(!n){toast('No records in “'+a.name+'”');return;}
  var opts=D.accounts.filter(function(x){return x.id!==a.id;}).sort(byName).map(function(x){return {v:x.id,l:x.name,icon:x.icon,color:x.color};});
  if(!opts.length){toast('Add another account first');return;}
  choiceSheet('Move '+n+' record'+(n===1?'':'s')+' from “'+a.name+'” to…',opts,'',function(to){
    var t=IDX.acc[to];if(!t)return;
    var skip=D.records.filter(function(r){return r.t==='x'&&((r.ac===a.id&&r.to===t.id)||(r.to===a.id&&r.ac===t.id));}).length;
    confirmSheet('Move to “'+t.name+'”?','Records in “'+a.name+'”, including transfers, will move to “'+t.name+'”. The opening balance stays with “'+a.name+'”.'+(skip?' '+skip+' transfer'+(skip===1?'':'s')+' between these two accounts will be left as they are.':'')+' This can’t be undone.','Move',function(){
      var m=0;
      D.records.forEach(function(r){
        if(r.t==='x'&&((r.ac===a.id&&r.to===t.id)||(r.to===a.id&&r.ac===t.id)))return;
        var hit=false;if(r.ac===a.id){r.ac=t.id;hit=true;}if(r.to===a.id){r.to=t.id;hit=true;}if(hit)m++;
      });
      (D.recurring||[]).forEach(function(r){if(r.ac===a.id)r.ac=t.id;if(r.to===a.id&&r.ac!==t.id)r.to=t.id;});
      if(D.meta.lastAccount===a.id)D.meta.lastAccount=t.id;
      save();render(true);toast(m+' record'+(m===1?'':'s')+' moved to '+t.name);
    });
  });
}

/* ---------- passcode ---------- */
function hashPin(pin,salt){
  var s=salt+':'+pin,h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function pinOk(pin){return D.settings.pin&&hashPin(pin,D.settings.salt)===D.settings.pin;}

function pinDialog(o){
  var el=document.createElement('div');el.className='lock';el.style.zIndex=o.z||320;
  var val='',api={};
  function draw(){
    var d='';for(var i=0;i<4;i++)d+='<i class="'+(i<val.length?'on':'')+'"></i>';
    $('.dots',el).innerHTML=d;
  }
  el.innerHTML='<h2 id="pn-t"></h2><div class="mut" id="pn-s" style="text-align:center;max-width:300px"></div><div class="dots" aria-hidden="true"></div><div class="perr" id="pn-e" role="alert"></div>'+
    '<div class="pinpad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-p="'+n+'" aria-label="'+n+'">'+n+'</button>';}).join('')+
    (o.cancelable?'<button class="plain" data-p="cancel">Cancel</button>':o.extra?'<button class="plain" data-p="extra">'+esc(o.extra)+'</button>':'<span></span>')+
    '<button data-p="0" aria-label="0">0</button><button class="plain" data-p="del" aria-label="Delete digit">⌫</button></div>';
  document.body.appendChild(el);
  api.reset=function(t,s){val='';$('#pn-t',el).textContent=t;$('#pn-s',el).textContent=s||'';draw();};
  api.error=function(m){$('#pn-e',el).textContent=m;var d=$('.dots',el);d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');val='';draw();};
  api.close=function(){el.remove();};
  api.el=el;
  el.addEventListener('click',function(e){
    var b=e.target.closest('[data-p]');if(!b)return;
    var k=b.dataset.p;
    if(k==='cancel'){el.remove();if(o.onCancel)o.onCancel();return;}
    if(k==='extra'){if(o.onExtra)o.onExtra(api);return;}
    $('#pn-e',el).textContent='';

    if(val.length>=4)return;

  });

  return api;
}

/* ---------- daily reminder ---------- */
function backupDue(){
  var ev=D.settings.backupEvery;if(ev==='off'||!D.records.length)return 0;
  var gap=ev==='weekly'?7:30,t=todayISO(),base=D.meta.lastBackup?D.meta.lastBackup.slice(0,10):(D.meta.firstUse||'');
  if(!base)return 0;
  var days=daysBetween(base,t)-1;return days>=gap?days:0;
}
function renderNudge(){
  var n=$('#nudge'),t=todayISO();n.innerHTML='';
  if(lockApi)return;
  if(!D.meta.firstUse){D.meta.firstUse=t;save();}
  var bd=backupDue();
  if(bd&&D.meta.bkNudgeDay!==t&&!(D.settings.remind&&D.meta.nudgeDay!==t&&nowHM()>=D.settings.remindTime&&!D.records.some(function(r){return r.d===t;}))){
    n.innerHTML='<div class="nudgebar"><span>'+(D.meta.lastBackup?'No saved copy for '+bd+' days.':'You haven’t saved a copy yet.')+'</span><button data-act="nudgeBackup">Save a copy</button><button data-act="nudgeBkOff" aria-label="Dismiss">✕</button></div>';
    return;
  }
  if(!D.settings.remind||D.meta.nudgeDay===t)return;
  if(nowHM()<D.settings.remindTime)return;
  if(D.records.some(function(r){return r.d===t;}))return;
  n.innerHTML='<div class="nudgebar"><span>Nothing logged today yet.</span><button data-act="nudgeAdd">Add record</button><button data-act="nudgeOff" aria-label="Dismiss reminder">✕</button></div>';
}

function copyText(text){
  return new Promise(function(res){
    function fb(){
      var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();res(ok);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){res(true);},fb);else fb();
  });
}
function textSheet(title,text,hint){
  var id=cb(function(){var ta=$('#ts-ta',topLayer());copyText(ta.value).then(function(ok){if(ok)toast('Copied');else{ta.focus();ta.select();toast('Press and hold, then Copy');}});});
  var el=openSheet('<h3>'+esc(title)+'</h3><p class="note" style="padding-top:0">'+esc(hint||'Copy this text and paste it into a note or a file.')+'</p><label class="field"><span class="sr" style="position:absolute;left:-9999px">Text</span><textarea id="ts-ta" readonly></textarea></label><div class="srow"><button class="btn" data-act="closeTop">Close</button><button class="btn primary" data-act="cb" data-cb="'+id+'" data-v="1">Copy</button></div>');
  $('#ts-ta',el).value=text;
}
function pasteSheet(title,hint,okLabel,onText){
  var id=cb(function(){var t=$('#ps-ta',topLayer()).value;if(!t.trim()){$('#ps-e',topLayer()).textContent='Paste something first.';return;}closeTop();onText(t);});
  openSheet('<h3>'+esc(title)+'</h3><p class="note" style="padding-top:0">'+esc(hint)+'</p><label class="field"><span class="sr" style="position:absolute;left:-9999px">Pasted text</span><textarea id="ps-ta" data-autofocus></textarea></label><div class="err" id="ps-e"></div><div class="srow"><button class="btn" data-act="closeTop">Cancel</button><button class="btn primary" data-act="cb" data-cb="'+id+'" data-v="1">'+esc(okLabel)+'</button></div>');
}
function saveFile(name,text,done){
  var inPlatform=!!(window.claude&&window.claude.use);
  if(inPlatform){
    window.claude.use('downloads').then(function(dl){
      if(!dl){textSheet(name,text);return;}
      dl.save({filename:name,data:text}).then(function(){toast('File saved');if(done)done();}).catch(function(err){
        if(err&&err.code==='declined')return;
        textSheet(name,text,'This view couldn’t save a file. Copy the text and paste it into a note or file instead.');
      });
    }).catch(function(){textSheet(name,text);});
  }else{
    try{
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;
      document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
      toast('File saved');if(done)done();
    }catch(e){textSheet(name,text);}
  }
}
function readFile(file,cb2){
  var fr=new FileReader();fr.onload=function(){cb2(String(fr.result||''));};fr.onerror=function(){toast('Couldn’t read that file.');};fr.readAsText(file);
}
